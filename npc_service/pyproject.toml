[project]
name = "npc-service"
version = "0.2.0"
description = "Inbox — single-surface epistolary game sidecar (FastAPI + Pydantic AI + llama-server)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.10,<3",
    "pydantic-ai>=1.0,<2",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.28,<0.29",
    "logfire[fastapi,httpx]>=4.0,<5",
    "pyyaml>=6.0,<7",
]

[build-system]
# Standard src-layout: hatchling auto-discovers src/npc_service/ as the package.
# uv installs the project editable into .venv on `uv sync`, so the package is on
# sys.path everywhere — no PYTHONPATH needed in Makefile, SidecarHost.cs, or
# pytest config.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npc_service"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.25",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running llama-server (skipped by default; run with `uv run pytest -m integration`)",
]
addopts = "-m 'not integration'"
