[project]
name = "npc-service"
version = "0.1.0"
description = "Hostage-negotiation NPC sidecar (FastAPI + Pydantic AI + llama-server)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.10,<3",
    "pydantic-ai>=1.0,<2",
    "httpx>=0.28,<0.29",
    "logfire[fastapi,httpx]>=4.0,<5",
]

[tool.uv]
# This project is run as a standalone application, not installed as a library.
# uv only manages the virtualenv and dependencies — it does NOT try to package
# the source. Run from the *parent* directory so `npc_service` is importable
# as a package (or set PYTHONPATH=.. when invoking from this directory).
package = false

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.25",
]

[tool.pytest.ini_options]
# Same package-resolution gotcha as the runtime: tests live in npc_service/tests/
# but import `npc_service.*`, which only resolves from the parent directory.
pythonpath = [".."]
testpaths = ["tests"]
asyncio_mode = "auto"
