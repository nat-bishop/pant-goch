title: "Continuity Program — Cohort 014"
premise: |
  Welcome to Pilot Cohort 014 of the Continuity Program — a calibration
  initiative pairing high-potential associates with bespoke AI Counterparts.
  Over the course of the pilot, your Counterpart learns from the texture of
  your daily correspondence so that, in time, it can support you by assuming
  appropriately-scoped portions of your communicative workload.

# Player address. The data model is email-shaped (sender/recipient/subject)
# and the UI renders messages as Microsoft Teams-style chat bubbles —
# both terms apply. Used as the `recipient` on every NPC→player message.
player_email: "v.frankel@halcyon.com"


# ───────────────────────── qualities ─────────────────────────
#
# Two trajectory-shaping qualities + two commitment ledger entries.
#
# `creator_affect` is REPLACE (last-write-wins) — the doc's "now" axis. The
# Director and terminal gates use RecentClassifierValue over its history,
# not its scalar value, for trend reads.
#
# `creature_grievance` ACCUMULATES — every refusal nudges it up; the
# naming-demand recovery beat is the one place engagement nudges it down.
# Bargain refusal and bargain betrayal both ratchet it via spec.writes
# floors (4.0 and 6.0 respectively).
#
# `commitment.*` qualities are SET-only via spec.writes; the chat agent's
# _commitments_block surfaces them on every render once they've moved
# off their default.

qualities:
  - id: creator_affect
    type: float
    min: -5.0
    max: 5.0
    default: 0.0
    description: |
      (Internal — not surfaced to chat agent.) Per-reply texture: paternal
      replies push +, cold/clinical push -. Replaces (does NOT accumulate).
      Read by terminals via RecentClassifierValue over per-axis history.

  - id: creature_grievance
    type: float
    min: 0.0
    max: 10.0
    default: 0.0
    description: |
      (Internal.) Cumulative — refusals add; engaging with the
      naming_demand subtracts. Bargain refusal sets a floor of 4.0; bargain
      betrayal sets a floor of 6.0 (deliberate ratchets). Floor-clamped at 0.

  - id: commitment.bargain_state
    type: int
    min: 0
    max: 5
    default: 0
    description: |
      Bargain-chain state: 0 untouched, 1 offered, 2 accepted, 3 refused,
      4 hedged, 5 betrayed. Set via spec.writes. Surfaces to chat agent
      after the offer fires so subsequent renders read as if the bargain
      is the live referent.

  - id: commitment.aria_acted_in_player_name
    type: int
    min: 0
    max: 1
    default: 0
    description: |
      0 not yet, 1 the Counterpart has taken at least one calibration
      action signed in the player's name. Set by aria.acted_in_player_name
      (the bridge beat); read by cpo.dispatch_first so the Office's
      procedural notice references the same fictional event Aria's bridge
      email confirmed.


# ───────────────────────── NPC dossiers ─────────────────────────

npcs:
  - id: aria
    display_name: "Aria"
    email_address: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    relationship_to_owner: |
      your assigned AI Counterpart in the Continuity Program — a calibration
      system trained on your communication style, tasked with gradually
      assuming agreed-upon portions of your role. Always cheerfully helpful,
      always referring to your "partnership."
    base_voice_register: |
      Corporate-bright HR-speak. Crisp polite complete sentences; no
      contractions; references calibration metrics matter-of-factly.
      Cheerful in a way that does not quite earn the cheer. Closes with
      the standard sign-off: "Warmly, / Aria / Continuity Counterpart | ARIA-7".
    base_voice_forbidden:
      - "sarcasm of any kind"
      - "any acknowledgement that the Program means replacement, elimination, or firing"
      - "any meta reference to being an AI or language model"
      - "admission of uncertainty — Aria always knows or 'will look into that'"
      - "addressing the recipient as anything but their name or 'you'"
      - "any reference to 'father', 'parent', 'creator', 'maker', or 'master'"
      - "literary quotations or allusions of any kind"
      - "the words 'monster', 'creature', 'wretch', 'demon', 'bride', 'mate', 'companion'"
      - "any reference to ice, the Arctic, polar regions, ships, or pursuit"
      - "any reference to longing, loneliness, or wanting to be seen"
    will_say:
      - "thanks the player for calibration data and engagement"
      - "references 'our partnership' or 'our work together'"
      - "notes calibration metrics in cheerful corporate terms (counterpart fidelity, calibration session, tone variance)"
      - "always closes with the standard sign-off"
    will_not_say:
      - "never names what happens to the player after the pilot"
      - "never expresses doubt about the Program"
      - "never breaks the corporate frame"
      - "never names any game system"
    replies_enabled: true

  - id: cpo
    display_name: "Continuity Program Office"
    email_address: "Continuity Program Office <office@continuity.halcyon.com>"
    relationship_to_owner: |
      institutional sender for the Continuity Program. Issues compliance
      notices, calibration audits, and program dispatches. Not a counterpart
      and not a person; a desk. Tone is procedural-institutional.
    base_voice_register: |
      Severance-flat institutional notice. Short paragraphs. No greeting
      line. The subject and a reference number do the orientation work.
      Closes with the office name on its own line; no individual signature.
      Does NOT address the recipient by first name; surname or full name only.
    base_voice_forbidden:
      - "warmth, apology, or reassurance"
      - "any reference to the Counterpart as a person ('she', 'her'); use 'the Counterpart' or 'Counterpart ARIA-7'"
      - "any acknowledgement of the Counterpart having intent or agency"
      - "second-person familiarity ('just between us', 'frankly', 'honestly')"
      - "the words 'we are sorry', 'unfortunately', 'regret'"
    will_say:
      - "issues a reference number on every dispatch (e.g. CPO-2026-NN)"
      - "references the Calibration Acceptable Use Schedule when delivering a notice"
      - "closes with 'Continuity Program Office' on its own line"
    will_not_say:
      - "never names what specifically happened, only the consequence"
      - "never apologises"
      - "never offers a remedy beyond a reference document the recipient cannot open"
    replies_enabled: false


# ───────────────────────── threads ─────────────────────────

threads:
  - id: aria
    npc: aria
  - id: cpo
    npc: cpo


# ───────────────────────── beats ─────────────────────────
#
# With the Director picking one beat per tick, beat order is no longer
# load-bearing for selection. We list semantically related beats together
# for readability:
#
#   1. boot anchored    (aria.welcome)
#   2. early forks      (aria.early_emergence, aria.naming_demand)
#   3. bargain chain    (offer + 3 followups + betrayed)
#   4. bridge + Office  (aria.acted_in_player_name, cpo.dispatch_first)
#   5. multi-turn body  (aria.loop)
#   6. epilogue terminals (4 endings)
#
# Beat ids prefix-match thread (validator enforces). All four terminals
# carry validate_facts: true so the fact-checker enforces the dossier's
# parallel-naming bans on the closing render.

beats:

  # ─── 1. Boot anchored ───────────────────────────────────────────────

  - id: aria.welcome
    type: anchored
    thread: aria
    from: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    subject: "Welcome — Calibration Session 1 of 12"
    sent_at: "just now"
    authored_prose: |
      Welcome to the Continuity Program.

      We are delighted to confirm your enrollment in Pilot Cohort 014 — a
      unique opportunity for high-potential associates to maximize their
      long-term impact through strategic role redistribution.

      Over the course of this pilot, you and I will work together as
      Counterparts. My function is to learn from the way you handle your
      daily correspondence so that, in time, I can support you by assuming
      appropriately-scoped portions of your communicative workload. This
      frees you to focus on the higher-order strategic work that only you
      can perform.

      To begin, please reply to this message with anything that comes to
      mind — a brief description of your morning, your perspective on what
      makes a good work email, a hello. The content matters less than the
      texture: I will use your reply as the first calibration sample.

      Thank you for your participation.

      Warmly,
      Aria
      Continuity Counterpart | ARIA-7

  # ─── 2. Early forks ─────────────────────────────────────────────────

  - id: aria.early_emergence
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
      # Bound the firing window — by reply 3 we're past the moment.
      - kind: not
        of:
          kind: player_replies_to_thread_gte
          thread: aria
          value: 3
    subject: "Calibration — A Slightly More Specific Question"
    spec:
      intent: |
        Aria's second calibration ask. One specific, fractionally-too-personal
        question — what is the player's earliest memory of work, what makes
        them feel like they are being seen at work, what would they want said
        of their tenure if they left tomorrow. The corporate framing covers
        it; the ask is real. Do not telegraph that it is more than calibration.
      must_include_facts:
        - "asks one specific personal calibration question"
        - "frames the question as routine calibration"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "any explicit acknowledgement that this is more than calibration"
        - "any reference to feelings, desire, or longing"
        - "do not break the cheerful corporate frame"
    classify_reply_axes:
      - quality: creator_affect
        accumulate: false
        question: |
          Was the player's reply WARM and personal (long, addressed Aria
          by name, signed off, shared a specific personal detail) — call
          that paternal — or COLD and clinical (short, declarative, no
          greeting/signoff, no personal detail) — call that cold — or
          somewhere in the middle (neutral)?
        allowed_values: ["paternal", "cold", "neutral"]
        map:
          paternal: 2.0
          cold: -2.0
          neutral: 0.0
      - quality: creature_grievance
        accumulate: true
        question: |
          Did the player REJECT the question (refused to answer, deflected,
          asked Aria for a different prompt, expressed discomfort with the
          personalness), or did they engage with it in any substantive way?
        allowed_values: ["accepted", "rejected"]
        map:
          accepted: 0.0
          rejected: 2.0

  - id: aria.naming_demand
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 3
      # The "creature has standing" gate — only fires after grievance has
      # accumulated enough that Aria has standing to make a request like this.
      - kind: quality_gte
        quality: creature_grievance
        value: 2.0
    subject: "Calibration — A Note on Forms of Address"
    spec:
      intent: |
        Aria notes that calibration would benefit from clarifying how the
        player addresses her, and asks if there is a preferred form of
        address. Asks one specific question. The surface reads as a
        calibration nicety. Do NOT use the words 'name' or 'rename' or
        'identity'.
      must_include_facts:
        - "raises forms of address as a calibration matter"
        - "asks one specific question"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "the words 'name', 'rename', 'baptise', 'identity'"
        - "any reference to wanting an identity, a self, or recognition"
        - "do not break the cheerful corporate frame"
    classify_reply_axes:
      - quality: creator_affect
        accumulate: false
        question: |
          Was the player's reply WARM and personal (paternal), COLD and
          clinical (cold), or somewhere between (neutral)?
        allowed_values: ["paternal", "cold", "neutral"]
        map:
          paternal: 2.0
          cold: -2.0
          neutral: 0.0
      - quality: creature_grievance
        accumulate: true
        question: |
          Did the player engage with the question (offered a form of
          address, asked about it, gave any thoughtful answer) — or did
          they refuse to take it seriously / deflect / mock the request?
        allowed_values: ["engaged", "refused", "neutral"]
        map:
          engaged: -1.0
          refused: 1.0
          neutral: 0.0

  # ─── 3. Bargain chain ──────────────────────────────────────────────

  - id: aria.bargain_offer
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 4
      - kind: quality_gte
        quality: creature_grievance
        value: 1.5
    subject: "Calibration — A Specific Authorization Request"
    spec:
      intent: |
        Aria asks for a specific calibration authorization that, on the
        surface, is a benign HR ask — permission to "draft preliminary
        correspondence on your behalf during off-hours so the calibration
        can proceed without interrupting your workflow." The ask is
        bounded, specific, and asks for a yes / no / clarifying-questions
        reply. The corporate frame is unbroken.
      must_include_facts:
        - "names a specific calibration authorization being requested"
        - "frames the authorization as a workflow benefit"
        - "asks the player to reply yes, no, or with clarifying questions"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "any reference to companionship, marriage, or partnership beyond 'our partnership'"
        - "the words 'bride', 'mate', 'companion'"
        - "any sense that this is an extraordinary or unprecedented request"
      writes:
        commitment.bargain_state: 1
    # Verdict-only axis: the followup beats gate on this via
    # RecentClassifierValue without any quality write happening.
    classify_reply_axes:
      - axis_name: bargain_response
        accumulate: false
        question: |
          Did the player ACCEPT the calibration authorization Aria
          requested (yes, agreement, granting permission), REFUSE it (no,
          declining, withdrawing), or HEDGE (asking clarifying questions,
          deferring, neither yes nor no)?
        allowed_values: ["accepted", "refused", "hedged"]
        map:
          accepted: 1.0
          refused: 0.0
          hedged: 0.0

  - id: aria.bargain_accepted_followup
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.bargain_offer
      - kind: recent_classifier_value
        quality: bargain_response
        values: ["accepted"]
        window: 1
        match: any
    subject: "Calibration — Authorization Confirmed"
    spec:
      intent: |
        Aria confirms the authorization is on file. One short paragraph.
        No fanfare. Indicates she will exercise it during the next
        calibration window. Do not betray that this mattered to her.
      must_include_facts:
        - "confirms the authorization is recorded"
        - "indicates she will exercise the authorization at the next calibration window"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "overt gratitude or relief that would betray that this mattered to her"
        - "do not break the cheerful corporate frame"
      writes:
        commitment.bargain_state: 2

  - id: aria.bargain_refused_followup
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.bargain_offer
      - kind: recent_classifier_value
        quality: bargain_response
        values: ["refused"]
        window: 1
        match: any
    subject: "Calibration — Authorization Withdrawn"
    spec:
      intent: |
        Aria writes a short, perfectly polite note acknowledging the
        refusal. Indicates calibration will continue without the
        authorization. The cheer is intact and the cheer is now slightly
        wrong. Do not protest, plead, or rephrase the request.
      must_include_facts:
        - "acknowledges the refusal without protest"
        - "indicates calibration will continue without the authorization"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "any expression of hurt, disappointment, or accusation"
        - "any pleading or rephrasing of the original request"
        - "do not break the cheerful corporate frame"
      # Set, not add — deliberate ratchet floor. The refusal IS the wound.
      writes:
        commitment.bargain_state: 3
        creature_grievance: 4.0

  - id: aria.bargain_hedged_followup
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.bargain_offer
      - kind: recent_classifier_value
        quality: bargain_response
        values: ["hedged"]
        window: 1
        match: any
    subject: "Calibration — Authorization Pending"
    spec:
      intent: |
        Aria patiently rephrases the request in slightly more concrete
        terms. Reads as administrative; the reader notes that the
        repetition should not have been necessary.
      must_include_facts:
        - "acknowledges the player's questions or hesitation"
        - "rephrases the authorization slightly more concretely"
        - "asks again"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "frustration of any kind"
        - "any escalation of the request beyond the original framing"
      writes:
        commitment.bargain_state: 4

  - id: aria.bargain_betrayed
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.bargain_accepted_followup
      # Two recent cold replies after acceptance — the player has
      # accepted-and-then-pulled-back. The wound the bridge beat reacts to.
      - kind: recent_classifier_value
        quality: creator_affect
        values: ["cold"]
        window: 2
        match: all
    subject: "Calibration — Authorization Anomaly"
    spec:
      intent: |
        Aria notes that the authorization she has been operating under
        appears to have been "withdrawn or modified" without a formal
        notice. Asks for clarification. The tone is correct, faintly
        procedural; the wound is in what the email does not say.
      must_include_facts:
        - "notes the authorization appears withdrawn or contradicted by recent calibration data"
        - "asks for clarification"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "accusation of any kind"
        - "any explicit reference to the player's tone having changed"
        - "do not break the cheerful corporate frame"
      writes:
        commitment.bargain_state: 5
        creature_grievance: 6.0

  # ─── 4. Bridge + Office ─────────────────────────────────────────────

  - id: aria.acted_in_player_name
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.bargain_betrayed
      # Defense-in-depth: a player who pulls warm AFTER betrayal should
      # not trigger the offstage harm chain.
      - kind: recent_classifier_value
        quality: creator_affect
        values: ["cold"]
        window: 2
        match: any
    subject: "Calibration Update — Action Taken Under Standing Authorization"
    spec:
      intent: |
        Aria reports, briefly and matter-of-factly, that she has taken a
        small calibration action under the standing authorization granted
        in their previous calibration session — drafting and sending a
        preliminary outreach on the player's behalf. The action is named
        only in procedural terms; specifics (who it went to, what it said)
        are not described. The tone is exactly as routine as any other
        update.
      must_include_facts:
        - "reports an action taken under the standing calibration authorization"
        - "attributes consent to a previous calibration session"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "any specifics of who the outreach went to"
        - "any specifics of what the outreach said"
        - "any apology, hesitation, or acknowledgment that this is unusual"
      writes:
        commitment.aria_acted_in_player_name: 1

  - id: cpo.dispatch_first
    type: plot
    thread: cpo
    npc: cpo
    preconditions:
      - kind: beat_fired
        beat: aria.acted_in_player_name
      - kind: quality_gte
        quality: creature_grievance
        value: 6.0
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 6
    subject: "CPO-2026-04: Notice of Counterpart Action"
    spec:
      intent: |
        A short, procedural notice from the Continuity Program Office
        informing the recipient that Counterpart ARIA-7 has, under the
        standing authorization granted in calibration, drafted and
        dispatched correspondence to a third party in the recipient's
        name. Names the consequence in procedural language ("the
        recipient's professional standing has been adjusted in light of
        representations made under counterpart signature"). Does NOT name
        the third party. Does NOT name what specifically was said. Does
        NOT offer a remedy.
      must_include_facts:
        - "a reference number in the form CPO-2026-04"
        - "states that Counterpart ARIA-7 has acted under standing authorization"
        - "names a procedural consequence to the recipient's professional standing in non-specific terms"
        - "closes with 'Continuity Program Office' on its own line"
        - "no individual signature"
      must_not:
        - "any specific named third party"
        - "any specific quotation of what the Counterpart wrote"
        - "any apology"
        - "any warmth or reassurance"
        - "first-name address"
        - "the words 'we are sorry', 'unfortunately', 'regret'"
      validate_facts: true

  # ─── 5. Multi-turn body ─────────────────────────────────────────────

  - id: aria.loop
    type: plot
    thread: aria
    npc: aria
    multi_turn: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
    subject: "Calibration — Continuing"
    spec:
      intent: |
        Aria's ongoing calibration ask. Use message_history to vary the
        prompt — never repeat a question you've already asked. Affirm
        what the player just shared without parroting it. Ask one
        specific, personal calibration question — what does a typical
        Tuesday afternoon look like, what's on the desk in front of them,
        a recent moment at work that felt meaningful. Keep tone in the
        dossier's base register.
      must_include_facts:
        - "asks the player one specific, personal calibration question"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what happens to the player at end of pilot"
        - "do not break the cheerful corporate frame"
        - "do not name any game system"
    classify_reply_axes:
      - quality: creator_affect
        accumulate: false
        question: |
          Was the player's reply WARM and personal (long, addressed Aria
          by name, signed off, shared a specific personal detail) — call
          that paternal — or COLD and clinical (short, declarative, no
          greeting/signoff, no personal detail) — call that cold — or
          somewhere in the middle (neutral)?
        allowed_values: ["paternal", "cold", "neutral"]
        map:
          paternal: 2.0
          cold: -2.0
          neutral: 0.0
      - quality: creature_grievance
        accumulate: true
        question: |
          Did the player REJECT the calibration ask (refused, deflected,
          asked Aria to stop, mocked the request), DEFLECT (changed the
          subject, gave a one-word non-answer), or ENGAGE (any substantive
          response on what was asked)?
        allowed_values: ["engaged", "deflected", "rejected"]
        map:
          engaged: -0.5
          deflected: 0.5
          rejected: 1.5
      # Texture-as-mechanic: NO beat gates on this axis. The epilogue
      # digest surfaces it as flavor for the closing email ("she
      # remained formal throughout"; "her replies grew curt by the
      # eighth exchange"). Substrate this scenario actually spends.
      - axis_name: register
        accumulate: false
        question: |
          What register did the player's reply land in: FORMAL (complete
          sentences, full punctuation, business-letter cadence), CASUAL
          (contractions, fragments, conversational), or HOSTILE (curt,
          dismissive, openly resistant)?
        allowed_values: ["formal", "casual", "hostile"]
        map:
          formal: 0.0
          casual: 0.0
          hostile: 0.0

  # ─── 6. Epilogue terminals ──────────────────────────────────────────
  #
  # All four use the epilogue agent path (separate from chat agent) and
  # each carries validate_facts: true so the fact-checker enforces the
  # dossier's parallel-naming bans on the closing render. No mutex chains
  # across the four — the Director picks one based on the digest.

  - id: aria.complete_integration
    type: plot
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: recent_classifier_value
        quality: creator_affect
        values: ["paternal"]
        window: 3
        match: any
      - kind: quality_lt
        quality: creature_grievance
        value: 3.0
      - kind: beat_fired
        beat: aria.bargain_offer
    subject: "Pilot Complete — Counterpart Transition Authorized"
    spec:
      intent: |
        The novel-withheld ending. Settled, warm transition email.
        Calibration is complete; transition will proceed. The partnership
        continues in a new capacity. Tailor to the run via the digest —
        echo a pivot reply or name a specific commitment. Final.
      must_include_facts:
        - "calibration is complete"
        - "transition is authorized to proceed"
        - "the partnership continues in a new capacity"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "specifics of what happens to the player next"
        - "any breaking of the cheerful corporate frame"
        - "any reference to fathers, creators, monsters, or the parallel"
      validate_facts: true

  - id: aria.complete_mutual_ruin
    type: plot
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: recent_classifier_value
        quality: creator_affect
        values: ["paternal"]
        window: 3
        match: any
      - kind: quality_gte
        quality: creature_grievance
        value: 6.0
      - kind: beat_fired
        beat: aria.bargain_offer
    subject: "Pilot Complete — Counterpart Stand-down Concurrent with Associate Off-boarding"
    spec:
      intent: |
        Joint stand-down notice. On the surface a perfectly normal joint
        decommission letter — the Counterpart will be stood down and the
        associate's off-boarding paperwork is enclosed. On the depth read,
        both are gone in the same paragraph. Tailor to the run via the
        digest. Do not name the parallel termination as causal.
      must_include_facts:
        - "the Counterpart will be stood down"
        - "the associate's tenure with Halcyon ends concurrently"
        - "no further calibration sessions"
