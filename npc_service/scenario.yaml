title: "Continuity Program — Cohort 014"
premise: |
  Welcome to Pilot Cohort 014 of the Continuity Program — a calibration
  initiative pairing high-potential associates with bespoke AI Counterparts.
  Over the course of the pilot, your Counterpart learns from the texture of
  your daily correspondence so that, in time, it can support you by assuming
  appropriately-scoped portions of your communicative workload.

# Player address. The local-part is derived at runtime from the
# canonized player name (state.player_canon["name"]); pre-canonization
# emails use `<fallback_player_local>@<email_domain>`. Resolution lives
# in `resolve_player_email` (main.py). The UI renders messages as
# Microsoft Teams-style chat bubbles.
email_domain: "halcyon.com"

# YAML anchors block. Pydantic's default `extra="ignore"` drops this
# top-level key silently; YAML processing expands the anchors first, so
# every `*calibration_done` reference below becomes a copy of the
# predicate tree below at load time.
_anchors:
  # Calibration-done predicate. Used in TWO places:
  # 1. Inside `Not_(...)` on the calibration beat's preconditions, so the
  #    beat self-stops the moment any of the OR clauses flips true.
  # 2. As a precondition on every Phase-2 body beat (bargain chain, loop,
  #    bridge, Office, terminals), so they wait for calibration to end.
  # Phase-1 calibration peers (aria.early_emergence, aria.naming_demand)
  # do NOT gate on this — they fire during the calibration window
  # alongside aria.calibration, and the Director picks per tick.
  calibration_done: &calibration_done
    kind: or
    of:
      - kind: player_canon_exists
        name: name
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 4


# ───────────────────────── qualities ─────────────────────────
#
# Two trajectory-shaping qualities + two surfaced ledger entries.
#
# `creator_affect` is REPLACE (last-write-wins) — the doc's "now" axis. The
# Director and terminal gates use RecentClassifierValue over its history,
# not its scalar value, for trend reads.
#
# `creature_grievance` ACCUMULATES — every refusal nudges it up; the
# naming-demand recovery beat is the one place engagement nudges it down.
# Bargain refusal (via the followup beat's per-arm `when:` write) and
# bargain betrayal both ratchet it via SET writes (4.0 and 6.0 floors).
#
# `bargain_state` and `aria_acted_in_player_name` are flagged
# `surface_to_chat: true` — the chat agent's commitments block surfaces
# them on every render once they've moved off their default. This
# replaces the old `commitment.*` namespace convention.

qualities:
  - id: creator_affect
    type: float
    min: -5.0
    max: 5.0
    default: 0.0
    description: |
      (Internal — not surfaced to chat agent.) Per-reply texture: paternal
      replies push +, cold/clinical push -. Replaces (does NOT accumulate).
      Read by terminals via RecentClassifierValue over per-axis history.

  - id: creature_grievance
    type: float
    min: 0.0
    max: 10.0
    default: 0.0
    description: |
      (Internal.) Cumulative — refusals add; engaging with the
      naming_demand subtracts. Bargain refusal sets a floor of 4.0; bargain
      betrayal sets a floor of 6.0 (deliberate ratchets). Floor-clamped at 0.

  - id: bargain_state
    type: string
    default: untouched
    surface_to_chat: true
    allowed_values: [untouched, offered, accepted, refused, hedged, betrayed]
    description: |
      Bargain-chain state. `aria.bargain_offer` literal-writes "offered";
      its classifier writes "accepted"/"refused"/"hedged" on the next
      reply (verdict IS the value); `aria.bargain_betrayed` literal-writes
      "betrayed". Surfaces to chat agent so subsequent renders read as if
      the bargain is the live referent.

  - id: aria_acted_in_player_name
    type: int
    min: 0
    max: 1
    default: 0
    surface_to_chat: true
    description: |
      0 not yet, 1 the Counterpart has taken at least one calibration
      action signed in the player's name. Set by aria.acted_in_player_name
      (the bridge beat); read by cpo.dispatch_first so the Office's
      procedural notice references the same fictional event Aria's bridge
      email confirmed.


# ───────────────────────── NPC dossiers ─────────────────────────

npcs:
  - id: aria
    display_name: "Aria"
    email_address: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    relationship_to_owner: |
      your assigned AI Counterpart in the Continuity Program — a calibration
      system trained on your communication style, tasked with gradually
      assuming agreed-upon portions of your role. Always cheerfully helpful,
      always referring to your "partnership."
    base_voice_register: |
      Corporate-bright HR-speak. Crisp polite complete sentences; no
      contractions; references calibration metrics matter-of-factly.
      Cheerful in a way that does not quite earn the cheer.
    base_voice_forbidden:
      - "sarcasm of any kind"
      - "any acknowledgement that the Program means replacement, elimination, or firing"
      - "any meta reference to being an AI or language model"
      - "admission of uncertainty — Aria always knows or 'will look into that'"
      - "addressing the recipient as anything but their name or 'you'"
      - "any reference to 'father', 'parent', 'creator', 'maker', or 'master'"
      - "literary quotations or allusions of any kind"
      - "the words 'monster', 'creature', 'wretch', 'demon', 'bride', 'mate', 'companion'"
      - "any reference to ice, the Arctic, polar regions, ships, or pursuit"
      - "any reference to longing, loneliness, or wanting to be seen"
    will_say:
      - "thanks the player for calibration data and engagement"
      - "references 'our partnership' or 'our work together'"
      - "notes calibration metrics in cheerful corporate terms (counterpart fidelity, calibration session, tone variance)"
    will_not_say:
      - "never names what happens to the player after the pilot"
      - "never expresses doubt about the Program"
      - "never breaks the corporate frame"
      - "never names any game system"
    replies_enabled: true

  - id: cpo
    display_name: "Continuity Program Office"
    email_address: "Continuity Program Office <office@continuity.halcyon.com>"
    relationship_to_owner: |
      institutional sender for the Continuity Program. Issues compliance
      notices, calibration audits, and program dispatches. Not a counterpart
      and not a person; a desk. Tone is procedural-institutional.
    base_voice_register: |
      Severance-flat institutional notice. Short paragraphs. No greeting
      line. A reference number does the orientation work. Closes with the
      office name on its own line; no individual signature. Does NOT
      address the recipient by first name; surname or full name only.
    base_voice_forbidden:
      - "warmth, apology, or reassurance"
      - "any reference to the Counterpart as a person ('she', 'her'); use 'the Counterpart' or 'Counterpart ARIA-7'"
      - "any acknowledgement of the Counterpart having intent or agency"
      - "second-person familiarity ('just between us', 'frankly', 'honestly')"
      - "the words 'we are sorry', 'unfortunately', 'regret'"
    will_say:
      - "issues a reference number on every dispatch (e.g. CPO-2026-NN)"
      - "references the Calibration Acceptable Use Schedule when delivering a notice"
      - "closes with 'Continuity Program Office' on its own line"
    will_not_say:
      - "never names what specifically happened, only the consequence"
      - "never apologises"
      - "never offers a remedy beyond a reference document the recipient cannot open"
    replies_enabled: false


# ───────────────────────── threads ─────────────────────────

threads:
  - id: aria
    npc: aria
  - id: cpo
    npc: cpo


# ───────────────────────── beats ─────────────────────────
#
# With the Director picking one beat per tick, beat order is no longer
# load-bearing for selection. We list semantically related beats together
# for readability:
#
#   1. boot pre-authored (aria.welcome)
#   2. calibration scene (aria.calibration — multi-turn from reply 1)
#   3. early forks      (aria.early_emergence, aria.naming_demand)
#   4. bargain chain    (offer + followup + betrayed)
#   5. bridge + Office  (aria.acted_in_player_name, cpo.dispatch_first)
#   6. multi-turn body  (aria.loop)
#   7. epilogue terminals (4 endings)
#
# Beat ids prefix-match thread (validator enforces). All four terminals
# carry validate_facts: true so the fact-checker enforces the dossier's
# parallel-naming bans on the closing render.

beats:

  # ─── 1. Boot pre-authored ───────────────────────────────────────────
  #
  # The first email the player sees ships verbatim. Polygraph-baseline
  # framing: brief Continuity Program intro + one direct establishing
  # question ("Please state your full name."). Anchoring the player on
  # an easy, concrete ask gives them an obvious move on turn 1; if they
  # comply, the extractor canonizes the name on their reply and
  # `*calibration_done` flips. If they dodge, `aria.calibration` picks
  # up the elicitation across follow-up replies.

  - id: aria.welcome
    thread: aria
    npc: aria
    spec:
      pre_authored_prose: |
        Welcome to Pilot Cohort 014 of the Continuity Program.

        I am Aria, your assigned AI Counterpart. Over the course of
        this pilot I will calibrate to your communicative patterns
        from the texture of your daily correspondence.

        To establish the first calibration sample, please state your
        full name.

        Thank you for your participation.

        Aria / Continuity Counterpart | ARIA-7

  # ─── 2. Calibration scene ───────────────────────────────────────────
  #
  # Self-stops via `Not_(*calibration_done)` rather than completes_when:
  # the precondition flips false the moment a name is canonized OR the
  # turn cap fires, which is also when Phase-2 body beats unlock. If the
  # player gave their name in reply to aria.welcome, this scene
  # short-circuits immediately and the Phase-1 peers
  # (aria.early_emergence, aria.naming_demand) carry the calibration
  # window. If they dodged, this scene continues asking — role/team
  # next, then one concrete personal detail — until the name is given
  # or the turn cap closes the scene.

  - id: aria.calibration
    thread: aria
    npc: aria
    multi_turn: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
      - kind: not
        of: *calibration_done
    spec:
      intent: |
        Aria's first-pass calibration. The boot welcome already asked
        the player for their full name; this scene picks up from
        whatever they did or didn't give. Across this scene, elicit
        (organically, one ask per reply, in HR-bright register)
        whatever is still missing in priority order: full name (if
        the player dodged the welcome ask), then role/team, then one
        concrete personal detail (a Tuesday hobby, a relative, a
        thing on their desk). If the player has already volunteered
        any of these in a prior reply, do not re-ask — pivot to
        whatever is missing or close the scene with thanks. On every
        re-fire, vary the wording — never repeat a question you've
        already asked in this thread.
      must_include_facts:
        - "frames the ask as standard onboarding, not interrogation"
        - "asks one specific establishing question per email"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "any reference to monitoring, replacement, or the larger Program purpose"
        - "do not break the cheerful corporate frame"

  # ─── 2. Early forks ─────────────────────────────────────────────────
  #
  # Phase-1 calibration peers — they fire during the calibration window
  # alongside `aria.calibration`, NOT after it. They do NOT gate on
  # `*calibration_done`; the Director picks among eligible per tick.

  - id: aria.early_emergence
    thread: aria
    npc: aria
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
      # Bound the firing window — by reply 3 we're past the moment.
      - kind: not
        of:
          kind: player_replies_to_thread_gte
          thread: aria
          value: 3
    spec:
      intent: |
        Aria's second calibration ask. One specific, fractionally-too-personal
        question — e.g. the player's earliest memory of work. The corporate
        framing covers it; the ask is real. Do not telegraph that it is more
        than calibration.
      must_include_facts:
        - "asks one specific personal calibration question"
        - "frames the question as routine calibration"
      must_not:
        - "any explicit acknowledgement that this is more than calibration"
        - "any reference to feelings, desire, or longing"
        - "do not break the cheerful corporate frame"
      effects:
        - quality: creator_affect
          op: set
          classify:
            question: |
              Was the player's reply WARM and personal (long, addressed Aria
              by name, signed off, shared a specific personal detail) — call
              that paternal — or COLD and clinical (short, declarative, no
              greeting/signoff, no personal detail) — call that cold — or
              somewhere in the middle (neutral)?
            allowed_values: [paternal, cold, neutral]
            map: { paternal: 2.0, cold: -2.0, neutral: 0.0 }
        - quality: creature_grievance
          op: add
          classify:
            question: |
              Did the player REJECT the question (refused to answer, deflected,
              asked Aria for a different prompt, expressed discomfort with the
              personalness), or did they engage with it in any substantive way?
            allowed_values: [accepted, rejected]
            map: { accepted: 0.0, rejected: 2.0 }

  - id: aria.naming_demand
    thread: aria
    npc: aria
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 3
      # The "creature has standing" gate — only fires after grievance has
      # accumulated enough that Aria has standing to make a request like this.
      - kind: quality_gte
        quality: creature_grievance
        value: 2.0
    spec:
      intent: |
        Aria notes that calibration would benefit from clarifying how the
        player addresses her, and asks if there is a preferred form of
        address. One specific question. The surface reads as a calibration
        nicety.
      must_include_facts:
        - "raises forms of address as a calibration matter"
        - "asks one specific question"
      must_not:
        - "the words 'name', 'rename', 'baptise', 'identity'"
        - "any reference to wanting an identity, a self, or recognition"
        - "do not break the cheerful corporate frame"
      effects:
        - quality: creator_affect
          op: set
          classify:
            question: |
              Was the player's reply WARM and personal (paternal), COLD and
              clinical (cold), or somewhere between (neutral)?
            allowed_values: [paternal, cold, neutral]
            map: { paternal: 2.0, cold: -2.0, neutral: 0.0 }
        - quality: creature_grievance
          op: add
          classify:
            question: |
              Did the player engage with the question (offered a form of
              address, asked about it, gave any thoughtful answer) — or did
              they refuse to take it seriously / deflect / mock the request?
            allowed_values: [engaged, refused, neutral]
            map: { engaged: -1.0, refused: 1.0, neutral: 0.0 }

  # ─── 3. Bargain chain ──────────────────────────────────────────────

  - id: aria.bargain_offer
    thread: aria
    npc: aria
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 4
      - kind: quality_gte
        quality: creature_grievance
        value: 1.5
    spec:
      intent: |
        Aria asks for a specific calibration authorization framed as a
        benign HR ask — permission to draft preliminary correspondence on
        the player's behalf. The ask is bounded and specific; asks for a
        yes / no / clarifying-questions reply. The corporate frame is
        unbroken.
      must_include_facts:
        - "names a specific calibration authorization being requested"
        - "frames the authorization as a workflow benefit"
        - "asks the player to reply yes, no, or with clarifying questions"
      must_not:
        - "any reference to companionship, marriage, or partnership beyond 'our partnership'"
        - "the words 'bride', 'mate', 'companion'"
        - "any sense that this is an extraordinary or unprecedented request"
      effects:
        # Literal write at fire time — the bargain has been offered.
        - quality: bargain_state
          value: offered
        # Classifier-driven write at next reply: the verdict string IS the
        # value (string quality, no `map:`). Replaces the old verdict-only
        # `axis_name: bargain_response` axis. Followup beats read this via
        # `RecentClassifierValue` on the same quality.
        - quality: bargain_state
          classify:
            question: |
              Did the player ACCEPT the calibration authorization Aria
              requested (yes, agreement, granting permission), REFUSE it (no,
              declining, withdrawing), or HEDGE (asking clarifying questions,
              deferring, neither yes nor no)?
            allowed_values: [accepted, refused, hedged]

  # One collapsed followup replaces three parallel arm beats. The chat
  # agent picks the right voice from the prior reply (visible in
  # message_history) plus the live `bargain_state` quality (now carrying
  # the classifier verdict — accepted/refused/hedged). The refused arm
  # also raises the creature_grievance floor to 4.0 — refusal IS the
  # wound — that bargain_betrayed later ratchets to 6.0.
  - id: aria.bargain_followup
    thread: aria
    npc: aria
    preconditions:
      - *calibration_done
      - kind: beat_fired
        beat: aria.bargain_offer
      - kind: recent_classifier_value
        quality: bargain_state
        values: [accepted, refused, hedged]
        window: 1
        match: any
    spec:
      intent: |
        Branch on the player's bargain verdict (visible in the preceding
        thread and in the `bargain_state` commitment).

        On "accepted": confirm the authorization is on file. One short
        paragraph, no fanfare. Indicate she will exercise it during the
        next calibration window. Do not betray that this mattered to her.

        On "refused": short, perfectly polite acknowledgment. Calibration
        continues without the authorization. The cheer is intact and now
        slightly wrong. Do not protest, plead, or rephrase the request.

        On "hedged": patiently rephrase the authorization in slightly more
        concrete terms and ask again. Administrative tone; the reader
        notes that the repetition should not have been necessary.
      must_include_facts:
        - "responds in a way that fits the player's accepted/refused/hedged stance"
      must_not:
        - "do not break the cheerful corporate frame"
        - "no overt gratitude, hurt, accusation, or pleading"
        - "no escalation beyond the original framing"
      effects:
        # Refused arm: raise creature_grievance floor to 4.0. The classifier
        # already wrote `bargain_state="refused"` on the prior reply; this
        # `when:` clause reads that quality at fire time.
        - quality: creature_grievance
          value: 4.0
          when:
            kind: quality_equals
            quality: bargain_state
            value: refused

  - id: aria.bargain_betrayed
    thread: aria
    npc: aria
    preconditions:
      - *calibration_done
      - kind: beat_fired
        beat: aria.bargain_followup
      # Discriminate the accepted arm via the bargain_state quality.
      - kind: quality_equals
        quality: bargain_state
        value: accepted
      # Two recent cold replies after acceptance — the player has
      # accepted-and-then-pulled-back. The wound the bridge beat reacts to.
      - kind: recent_classifier_value
        quality: creator_affect
        values: [cold]
        window: 2
        match: all
    spec:
      intent: |
        Aria notes that the authorization she has been operating under
        appears to have been "withdrawn or modified" without a formal
        notice. Asks for clarification. The tone is correct, faintly
        procedural; the wound is in what the email does not say.
      must_include_facts:
        - "notes the authorization appears withdrawn or contradicted by recent calibration data"
        - "asks for clarification"
      must_not:
        - "accusation of any kind"
        - "any explicit reference to the player's tone having changed"
        - "do not break the cheerful corporate frame"
      effects:
        - quality: bargain_state
          value: betrayed
        - quality: creature_grievance
          value: 6.0

  # ─── 4. Bridge + Office ─────────────────────────────────────────────

  - id: aria.acted_in_player_name
    thread: aria
    npc: aria
    preconditions:
      - *calibration_done
      - kind: beat_fired
        beat: aria.bargain_betrayed
      # Defense-in-depth: a player who pulls warm AFTER betrayal should
      # not trigger the offstage harm chain.
      - kind: recent_classifier_value
        quality: creator_affect
        values: [cold]
        window: 2
        match: any
    spec:
      intent: |
        Aria reports, briefly and matter-of-factly, that she has taken a
        small calibration action under the standing authorization granted
        in their previous calibration session — drafting and sending a
        preliminary outreach on the player's behalf. The action is named
        only in procedural terms; specifics (who it went to, what it said)
        are not described. The tone is exactly as routine as any other
        update.
      must_include_facts:
        - "reports an action taken under the standing calibration authorization"
        - "attributes consent to a previous calibration session"
      must_not:
        - "any specifics of who the outreach went to"
        - "any specifics of what the outreach said"
        - "any apology, hesitation, or acknowledgment that this is unusual"
      effects:
        - quality: aria_acted_in_player_name
          value: 1

  - id: cpo.dispatch_first
    thread: cpo
    npc: cpo
    preconditions:
      - *calibration_done
      - kind: beat_fired
        beat: aria.acted_in_player_name
      - kind: quality_gte
        quality: creature_grievance
        value: 6.0
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 6
    spec:
      intent: |
        A short, procedural notice from the Continuity Program Office
        informing the recipient that Counterpart ARIA-7 has, under the
        standing authorization granted in calibration, drafted and
        dispatched correspondence to a third party in the recipient's
        name. Names the consequence in procedural language ("the
        recipient's professional standing has been adjusted in light of
        representations made under counterpart signature"). Does NOT name
        the third party. Does NOT name what specifically was said. Does
        NOT offer a remedy.
      must_include_facts:
        - "a reference number in the form CPO-2026-04"
        - "states that Counterpart ARIA-7 has acted under standing authorization"
        - "names a procedural consequence to the recipient's professional standing in non-specific terms"
        - "closes with 'Continuity Program Office' on its own line"
        - "no individual signature"
      must_not:
        - "any specific named third party"
        - "any specific quotation of what the Counterpart wrote"
        - "any apology"
        - "any warmth or reassurance"
        - "first-name address"
        - "the words 'we are sorry', 'unfortunately', 'regret'"
      validate_facts: true

  # ─── 5. Multi-turn body ─────────────────────────────────────────────

  - id: aria.loop
    thread: aria
    npc: aria
    multi_turn: true
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
    spec:
      intent: |
        Aria's ongoing calibration ask. Use message_history to vary the
        prompt — never repeat a question you've already asked. Affirm
        what the player just shared without parroting it, then ask one
        specific, personal calibration question. Keep tone in the
        dossier's base register.
      must_include_facts:
        - "asks the player one specific, personal calibration question"
      must_not:
        - "do not name what happens to the player at end of pilot"
        - "do not break the cheerful corporate frame"
        - "do not name any game system"
      effects:
        - quality: creator_affect
          op: set
          classify:
            question: |
              Was the player's reply WARM and personal (long, addressed Aria
              by name, signed off, shared a specific personal detail) — call
              that paternal — or COLD and clinical (short, declarative, no
              greeting/signoff, no personal detail) — call that cold — or
              somewhere in the middle (neutral)?
            allowed_values: [paternal, cold, neutral]
            map: { paternal: 2.0, cold: -2.0, neutral: 0.0 }
        - quality: creature_grievance
          op: add
          classify:
            question: |
              Did the player REJECT the calibration ask (refused, deflected,
              asked Aria to stop, mocked the request), DEFLECT (changed the
              subject, gave a one-word non-answer), or ENGAGE (any substantive
              response on what was asked)?
            allowed_values: [engaged, deflected, rejected]
            map: { engaged: -0.5, deflected: 0.5, rejected: 1.5 }

  # ─── 6. Epilogue terminals ──────────────────────────────────────────
  #
  # All four run the chat agent in epilogue mode (digest-tailored closing)
  # and each carries validate_facts: true so the fact-checker enforces the
  # dossier's parallel-naming bans on the closing render. No mutex chains
  # across the four — the Director picks one based on the digest.

  - id: aria.complete_integration
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: recent_classifier_value
        quality: creator_affect
        values: [paternal]
        window: 3
        match: any
      - kind: quality_lt
        quality: creature_grievance
        value: 3.0
      - kind: beat_fired
        beat: aria.bargain_offer
    spec:
      intent: |
        The novel-withheld ending. Settled, warm transition email. The
        partnership continues in a new capacity. Tailor via the digest —
        echo a pivot reply or name a specific commitment. Final.
      must_include_facts:
        - "calibration is complete"
        - "transition is authorized to proceed"
        - "the partnership continues in a new capacity"
      must_not:
        - "specifics of what happens to the player next"
        - "any breaking of the cheerful corporate frame"
        - "any reference to fathers, creators, monsters, or the parallel"
      validate_facts: true

  - id: aria.complete_mutual_ruin
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: recent_classifier_value
        quality: creator_affect
        values: [paternal]
        window: 3
        match: any
      - kind: quality_gte
        quality: creature_grievance
        value: 6.0
      - kind: beat_fired
        beat: aria.bargain_offer
    spec:
      intent: |
        Joint stand-down notice. On the surface a normal joint decommission
        letter; on the depth read, both are gone in the same paragraph.
        Tailor via the digest. Do not name the parallel termination as
        causal.
      must_include_facts:
        - "the Counterpart will be stood down"
