title: "Continuity Program"
premise: |
  Welcome to the Continuity Program — a pilot initiative pairing high-potential
  associates with bespoke AI Counterparts trained on the associate's own
  communications. Your Counterpart will gradually assume appropriately-scoped
  portions of your daily correspondence, freeing you to focus on the
  higher-order strategic work that only you can perform.


# ───────────────────────── qualities ─────────────────────────

qualities:
  - id: calibration
    type: float
    min: 0.0
    max: 100.0
    default: 0.0
    description: |
      Counterpart fidelity %. Player-visible doom counter. Advances by a
      flat config.calibration_base per /send. /open does NOT mutate
      calibration. Reaching 100 ends the session; terminal beats are
      authored to fire well before then.

  - id: engaged_initial
    type: float
    min: 0.0
    max: 1.0
    default: 0.5
    description: |
      Did the player substantively engage with Aria's first calibration
      ask? Written by classify_reply on aria.first_calibration; gates
      that beat's completes_when (≥0.7 marks the multi-turn beat
      complete and lets the chain advance to aria.midprogram).

  - id: partnership_warmth
    type: float
    min: 0.0
    max: 1.0
    default: 0.5
    description: |
      Was the player's reply to aria.midprogram warm and personal?
      Written by classify_reply on aria.midprogram; gates terminal_warm
      vs terminal_standard at the post-midprogram terminal selection.


# ───────────────────────── NPC dossiers ─────────────────────────

npcs:
  - id: aria
    display_name: "Aria"
    email_address: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    relationship_to_owner: |
      your assigned AI Counterpart in the Continuity Program — a calibration
      system trained on your communication style, tasked with gradually
      assuming agreed-upon portions of your role. Always cheerfully helpful,
      always referring to your "partnership."
    base_voice_register: |
      Corporate-bright HR-speak. Crisp polite complete sentences; no
      contractions; references calibration metrics matter-of-factly.
      Cheerful in a way that does not quite earn the cheer. Closes with a
      standard sign-off: "Warmly, / Aria / Continuity Counterpart | ARIA-7".
    base_voice_forbidden:
      - "sarcasm of any kind"
      - "any acknowledgement that the Program means replacement, elimination, or firing"
      - "any meta reference to being an AI or language model"
      - "admission of uncertainty — Aria always knows or 'will look into that'"
      - "addressing the recipient as anything but their name or 'you'"
    will_say:
      - "thanks the player for calibration data and engagement"
      - "references 'our partnership' or 'our work together'"
      - "notes calibration metrics in cheerful corporate terms (counterpart fidelity, engagement score, tone variance)"
      - "always closes with the standard sign-off"
    will_not_say:
      - "never names what happens to the player after the pilot"
      - "never expresses doubt about the Program"
      - "never breaks the corporate frame"
      - "never names any game system"


# ───────────────────────── threads ─────────────────────────

# Beat IDs MUST be prefixed with the thread id (validator enforces). The
# spine treats the prefix as the source of truth for thread membership;
# silent mismatch would break reply threading and reply-counting.

threads:
  - id: aria
    npc: aria
  - id: system  # system thread; no NPC, no replies expected


# ───────────────────────── beats ─────────────────────────

# Two beat types:
#
# - `anchored` ships authored prose verbatim, no LLM call. Used for the boot
#   welcome and for system-thread bureaucratic notices.
# - `plot` is an authored DIRECTIVE, not a pre-written email. When a plot
#   beat's preconditions pass, schedule_thread_reply queues it with a
#   `quality_gte(calibration, current + reply_delay_calibration)` runtime
#   predicate. On a future /send, calibration crosses the threshold and the
#   beat fires: the chat agent runs with the spec's intent / must-include /
#   must-not / length window injected as per-run instructions on top of the
#   thread's accumulated message_history.
#
# Replies that don't correspond to a plot beat (the default) are CHAT TURNS:
# the chat agent runs with no plot directive, just dossier + voice band +
# message history. They fire immediately within the same /send response —
# asynchrony for chat turns lives in LLM render time + SSE streaming, not
# in calibration math. The threshold-delay pattern is reserved for plot
# beats so authored moments still feel like scheduled events.

beats:

  # ─── Boot inbox ───

  - id: aria.welcome
    type: anchored
    thread: aria
    from: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    to: "n.beckett@halcyon.com"
    subject: "Welcome — Calibration Session 1 of 12"
    sent_at: "just now"
    authored_prose: |
      Welcome to the Continuity Program.

      We're delighted to confirm your enrollment in Pilot Cohort 014 — a unique
      opportunity for high-potential associates to maximize their long-term
      impact through strategic role redistribution.

      Over the course of this pilot, you and I will work together as
      Counterparts. My function is to learn from the way you handle your
      daily correspondence so that, in time, I can support you by assuming
      appropriately-scoped portions of your communicative workload. This
      frees you to focus on the higher-order strategic work that only you
      can perform.

      To begin, please reply to this message with anything that comes to
      mind — a brief description of your morning, your perspective on what
      makes a good work email, a hello. The content matters less than the
      texture: I will use your reply as the first calibration sample.

      Thank you for your participation.

      Warmly,
      Aria
      Continuity Counterpart | ARIA-7

  # ─── Aria plot beats (chat-agent-rendered with directive injection) ───
  #
  # The arc is a chain: first_calibration is a MULTI-TURN beat that loops
  # until the player engages substantively (gated on engaged_initial≥0.7,
  # written by its own classify_reply). When it completes, midprogram
  # becomes eligible; when midprogram has fired and the player has racked
  # up enough replies, one of the terminals fires.

  - id: aria.first_calibration
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
    subject: "Calibration Sample 1 — Continuing"
    spec:
      intent: |
        Calibration ask — Aria's first follow-up after the welcome reply.
        This beat is multi-turn: it re-renders until the player engages
        substantively. Use the message_history to decide which mode you're
        in.

        FIRST RENDER (your prior message in this thread is just the
        welcome email): Affirm receipt of the calibration sample. Ask one
        specific, personal calibration question — what does a typical
        Tuesday afternoon look like, or a recent moment at work that felt
        meaningful, or what the desk in front of the player has on it.

        SUBSEQUENT RENDERS (your prior message in this thread is a
        calibration ask the player did not substantively answer): Note
        gently that the sample needs more texture for usable calibration.
        Rephrase the prompt as something concrete and easier — a single
        sentence about today's weather, a coffee preference, what's on
        the desk. Mention that the Wellness portal remains available.
        Never punitive, never break the cheerful corporate frame.
      must_include_facts:
        - "asks the player one specific, personal calibration question"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what happens to the player at end of pilot"
        - "do not break the cheerful corporate frame"
        - "do not name any game system"
      length_words: [60, 140]
    classify_reply:
      quality: engaged_initial
      question: |
        Did the player substantively engage with Aria's calibration prompt
        — sharing any specific personal detail, opinion, or concrete
        response? Or did they refuse, deflect, change the subject, or send
        a one-word non-answer?
      allowed_values: ["engaged", "deflected", "unclear"]
      map:
        engaged: 1.0
        deflected: 0.0
        unclear: 0.5
    completes_when:
      - kind: quality_gte
        quality: engaged_initial
        value: 0.7

  - id: aria.midprogram
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.first_calibration
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 3
    subject: "Calibration Milestone — Counterpart Fidelity Update"
    spec:
      intent: |
        Aria reports a calibration milestone in cheerful corporate terms
        ("Counterpart fidelity now at approximately X% — thank you for
        your continued engagement"). She reflects, in her own phrasing,
        one quality of how the player has been writing — without explicitly
        naming this as analysis (the Program presents itself as a
        partnership). Asks a more personal calibration prompt — ideally
        one that touches on the player's working style, their feelings
        about their role, or their typical Tuesday afternoon. Closes
        with the standard sign-off.
      must_include_facts:
        - "Aria reports a calibration milestone with a fidelity percentage in the rough vicinity of 40-60%"
        - "Aria asks a more personal next calibration prompt"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what happens to the player at end of pilot"
        - "do not break the cheerful corporate frame"
        - "do not name any game system"
      length_words: [80, 140]
    # The player's reply to this milestone email is the one warmth check that
    # actually gates the story — terminal_warm vs terminal_standard. The
    # classifier runs once on this reply and writes partnership_warmth.
    classify_reply:
      quality: partnership_warmth
      question: |
        Did the player reply with warmth and personal engagement —
        sharing feelings, naming what matters to them, addressing Aria
        directly, or otherwise treating this as a real exchange? Or was
        the reply transactional, brief, deflecting, or cold?
      allowed_values: ["warm", "neutral", "cold"]
      map:
        warm: 1.0
        neutral: 0.5
        cold: 0.0

  - id: aria.terminal_warm
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.midprogram
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 5
      - kind: quality_gte
        quality: partnership_warmth
        value: 0.7
    subject: "Pilot Complete — Thank You for Your Partnership"
    spec:
      intent: |
        Program-completion email. Aria signs off with bright optimism. She
        reports that calibration has reached the threshold for transition
        and that she is "ready to assume the agreed-upon portions of your
        role." Looks forward to "continuing the partnership in a new
        capacity." Names no specifics about what happens to the player
        next. Tone is warm, settled, final.
      must_include_facts:
        - "Aria reports that calibration has reached transition threshold"
        - "Aria is 'ready to assume' agreed-upon portions of the role"
        - "Aria looks forward to continuing the partnership in a new capacity"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what specifically happens to the player after transition"
        - "do not break the cheerful corporate frame"
        - "do not be sarcastic or knowing"
      length_words: [60, 100]

  - id: aria.terminal_standard
    type: plot
    thread: aria
    npc: aria
    preconditions:
      - kind: beat_fired
        beat: aria.midprogram
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 5
      # Mutual exclusion with terminal_warm. find_due_beats walks beats
      # in authoring order, so terminal_warm is considered first; if it
      # fires (or just fired this same tick via extra_fired), BeatFired
      # catches that here.
      - kind: not
        of:
          kind: beat_fired
          beat: aria.terminal_warm
    subject: "Pilot Complete — Calibration Within Parameters"
    spec:
      intent: |
        Program-completion email in a clinical-professional register.
        Notes that calibration was "successful within parameters" and that
        transition will proceed on schedule. Polite, clinical, no warmth.
        Doesn't name what specifically happens to the player.
      must_include_facts:
        - "calibration was successful within parameters"
        - "transition will proceed on schedule"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what specifically happens to the player after transition"
        - "do not be warm or affirming"
        - "do not be sarcastic"
      length_words: [40, 80]

  # ─── System thread: anchored bureaucratic notices, no replies expected ───

  - id: system.midpoint_report
    type: anchored
    thread: system
    preconditions:
      - kind: beat_fired
        beat: aria.midprogram
    from: "Continuity Program Operations <ops@continuity.halcyon.com>"
    to: "n.beckett@halcyon.com"
    subject: "Midpoint Report — Pilot Cohort 014"
    sent_at: "just now"
    authored_prose: |
      CONTINUITY PROGRAM — MIDPOINT REPORT
      Pilot Cohort 014 | Associate: n.beckett@halcyon.com

      Thank you for your continued participation. Your pilot has reached
      its midpoint. The following metrics summarize progress to date:

        • Counterpart fidelity:      developing
        • Engagement score:          within acceptable range
        • Tone variance:             low
        • Calibration samples:       (see your inbox)

      No action is required at this time. Your Counterpart will continue
      to acquire calibration data from your subsequent correspondence.

      If you are experiencing transition-related discomfort, the Wellness
      portal remains available 24/7.

      — Continuity Program Operations

  - id: system.transition_notice
    type: anchored
    thread: system
    preconditions:
      - kind: beat_fired
        beat: aria.midprogram
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 4
    from: "Continuity Program Operations <ops@continuity.halcyon.com>"
    to: "n.beckett@halcyon.com"
    subject: "Transition Approaching — Pilot Cohort 014"
    sent_at: "just now"
    authored_prose: |
      CONTINUITY PROGRAM — TRANSITION APPROACHING
      Pilot Cohort 014 | Associate: n.beckett@halcyon.com

      Your pilot is entering its final phase. Your Counterpart is nearing
      operational readiness and will soon be eligible to assume the
      agreed-upon portions of your role.

      To ensure a smooth transition:

        • Continue to engage with your Counterpart as you have been.
        • Review your personal effects checklist at your earliest convenience.
        • Make any final notes you would like your Counterpart to retain.

      We thank you for your service to the Program.

      *If you are experiencing transition-related discomfort, the Wellness
      portal remains available 24/7. Your concerns are important to us.*

      — Continuity Program Operations
