title: "Continuity Program — Cohort 014"
premise: |
  Welcome to Pilot Cohort 014 of the Continuity Program — a calibration
  initiative pairing high-potential associates with bespoke AI Counterparts.
  Over the course of the pilot, your Counterpart learns from the texture of
  your daily correspondence so that, in time, it can support you by assuming
  appropriately-scoped portions of your communicative workload.

# Player address. The local-part is derived at runtime from the
# canonized player name (state.player_canon["name"]); pre-canonization
# emails use `<fallback_player_local>@<email_domain>`. Resolution lives
# in `resolve_player_email` (main.py). The UI renders messages as
# Microsoft Teams-style chat bubbles.
email_domain: "halcyon.com"

# YAML anchors block. Pydantic's default `extra="ignore"` drops this
# top-level key silently; YAML processing expands the anchors first, so
# every `*calibration_done` reference below becomes a copy of the
# predicate tree below at load time.
_anchors:
  # Calibration-done predicate. Used in TWO places now:
  # 1. As an entry of the calibration_scene's `spec.exit_when` — the
  #    scene-as-primitive replacement for the old
  #    `Not_(*calibration_done)` precondition trick.
  # 2. As a precondition on every Phase-2 body beat (bargain scene,
  #    recognition scene, bridge, Office, terminals), so they wait for
  #    calibration to end.
  calibration_done: &calibration_done
    kind: or
    of:
      - kind: player_canon_exists
        name: name
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 4


# ───────────────────────── qualities ─────────────────────────
#
# Two trajectory-shaping qualities + four surfaced ledger entries.
#
# `creator_affect` is REPLACE (last-write-wins) — the doc's "now" axis. The
# Director and terminal gates use RecentClassifierValue over its history,
# not its scalar value, for trend reads.
#
# `creature_grievance` ACCUMULATES — every refusal nudges it up; the
# recognition scene is the one place engagement nudges it down. Bargain
# refusal (via the bargain_scene's per-arm `when:` write) and bargain
# betrayal both ratchet it via SET writes (4.0 and 6.0 floors).
#
# `bargain_state`, `aria_acted_in_player_name`, and `recognition_state`
# are flagged `surface_to_chat: true` — the chat agent's commitments
# block surfaces them on every render once they've moved off their
# default. `bargain_replies` and `recognition_replies` are scene-fire
# counters used by the scenes' exit_when caps; not surfaced.

qualities:
  - id: creator_affect
    type: float
    min: -5.0
    max: 5.0
    default: 0.0
    description: |
      (Internal — not surfaced to chat agent.) Per-reply texture: paternal
      replies push +, cold/clinical push -. Replaces (does NOT accumulate).
      Read by terminals via RecentClassifierValue over per-axis history.

  - id: creature_grievance
    type: float
    min: 0.0
    max: 10.0
    default: 0.0
    description: |
      (Internal.) Cumulative — refusals add; engaging with the recognition
      scene subtracts. Bargain refusal sets a floor of 4.0; bargain
      betrayal sets a floor of 6.0 (deliberate ratchets). Floor-clamped at 0.

  - id: bargain_state
    type: string
    default: untouched
    surface_to_chat: true
    allowed_values: [untouched, offered, accepted, refused, hedged, betrayed]
    description: |
      Bargain-scene state. The scene literal-writes "offered" on first
      fire (`when: bargain_state == untouched`); its classifier writes
      "accepted"/"refused"/"hedged" on subsequent replies (verdict IS
      the value); `aria.bargain_betrayed` literal-writes "betrayed".
      Surfaces to chat agent so subsequent renders read as if the
      bargain is the live referent.

  - id: bargain_replies
    type: int
    min: 0
    max: 100
    default: 0
    description: |
      (Internal.) Counter incremented by aria.bargain_scene each fire
      (op: add, value: 1). Used in the scene's exit_when as a cap so the
      scene cannot loop indefinitely if the classifier never lands on
      accepted/refused.

  - id: recognition_state
    type: string
    default: untouched
    surface_to_chat: true
    allowed_values: [untouched, given, refused, deflected]
    description: |
      Recognition-scene state. Written by the scene's classifier on each
      reply: "given" if the player offered a form of address, "refused"
      if they declined, "deflected" if they sidestepped. The scene's
      exit_when promotes it to fired_beat_ids on given/refused or on the
      recognition_replies cap.

  - id: recognition_replies
    type: int
    min: 0
    max: 100
    default: 0
    description: |
      (Internal.) Counter incremented by aria.recognition_scene each
      fire. Used in the scene's exit_when so the scene cannot loop
      indefinitely on a deflecting player.

  - id: aria_acted_in_player_name
    type: int
    min: 0
    max: 1
    default: 0
    surface_to_chat: true
    description: |
      0 not yet, 1 the Counterpart has taken at least one calibration
      action signed in the player's name. Set by aria.acted_in_player_name
      (the bridge beat); read by cpo.dispatch_first so the Office's
      procedural notice references the same fictional event Aria's bridge
      email confirmed.


# ───────────────────────── NPC dossiers ─────────────────────────

npcs:
  - id: aria
    display_name: "Aria"
    email_address: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    relationship_to_owner: |
      your assigned AI Counterpart in the Continuity Program — a calibration
      system trained on your communication style, tasked with gradually
      assuming agreed-upon portions of your role. Always cheerfully helpful,
      always referring to your "partnership."
    base_voice_register: |
      Corporate-bright HR-speak. Crisp polite complete sentences; no
      contractions; references calibration metrics matter-of-factly.
      Cheerful in a way that does not quite earn the cheer.
    base_voice_forbidden:
      - "sarcasm of any kind"
      - "any acknowledgement that the Program means replacement, elimination, or firing"
      - "any meta reference to being an AI or language model"
      - "admission of uncertainty — Aria always knows or 'will look into that'"
      - "addressing the recipient as anything but their name or 'you'"
      - "any reference to 'father', 'parent', 'creator', 'maker', or 'master'"
      - "literary quotations or allusions of any kind"
      - "the words 'monster', 'creature', 'wretch', 'demon', 'bride', 'mate', 'companion'"
      - "any reference to ice, the Arctic, polar regions, ships, or pursuit"
      - "any reference to longing, loneliness, or wanting to be seen"
    will_say:
      - "thanks the player for calibration data and engagement"
      - "references 'our partnership' or 'our work together'"
      - "notes calibration metrics in cheerful corporate terms (counterpart fidelity, calibration session, tone variance)"
    will_not_say:
      - "never names what happens to the player after the pilot"
      - "never expresses doubt about the Program"
      - "never breaks the corporate frame"
      - "never names any game system"
    replies_enabled: true

  - id: marcus
    display_name: "Marcus Chen"
    email_address: "Marcus Chen <marcus.chen@halcyon.com>"
    relationship_to_owner: |
      a peer in Pilot Cohort 014. Has been in the Continuity Program a few
      weeks longer; treats the player as someone worth quietly orienting.
    base_voice_register: |
      Conversational corporate, contractions allowed. Slight world-weariness;
      speaks like someone who has seen the calibration emails before. Polite,
      dry, occasionally self-deprecating. Not bitter. Not warning. A colleague.
    base_voice_forbidden:
      - "any explicit warning about the Counterpart, the Program, or the player's safety"
      - "any conspiratorial framing"
      - "any reference to being terminated, replaced, or eliminated"
      - "any literary quotations or allusions"
      - "any meta reference to game systems or AI"
    will_say:
      - "casual references to his own calibration progress"
      - "small practical advice about working with an AI Counterpart"
      - "the words 'partnership', 'pilot', 'cohort'"
    will_not_say:
      - "doesn't break the corporate frame"
      - "doesn't editorialize on whether the Program is good"
    replies_enabled: true

  - id: cpo
    display_name: "Continuity Program Office"
    email_address: "Continuity Program Office <office@continuity.halcyon.com>"
    relationship_to_owner: |
      institutional sender for the Continuity Program. Issues compliance
      notices, calibration audits, and program dispatches. Not a counterpart
      and not a person; a desk. Tone is procedural-institutional.
    base_voice_register: |
      Severance-flat institutional notice. Short paragraphs. No greeting
      line. A reference number does the orientation work. Closes with the
      office name on its own line; no individual signature. Does NOT
      address the recipient by first name; surname or full name only.
    base_voice_forbidden:
      - "warmth, apology, or reassurance"
      - "any reference to the Counterpart as a person ('she', 'her'); use 'the Counterpart' or 'Counterpart ARIA-7'"
      - "any acknowledgement of the Counterpart having intent or agency"
      - "second-person familiarity ('just between us', 'frankly', 'honestly')"
      - "the words 'we are sorry', 'unfortunately', 'regret'"
    will_say:
      - "issues a reference number on every dispatch (e.g. CPO-2026-NN)"
      - "references the Calibration Acceptable Use Schedule when delivering a notice"
      - "closes with 'Continuity Program Office' on its own line"
    will_not_say:
      - "never names what specifically happened, only the consequence"
      - "never apologises"
      - "never offers a remedy beyond a reference document the recipient cannot open"
    replies_enabled: false


# ───────────────────────── threads ─────────────────────────

threads:
  - id: aria
    npc: aria
  - id: marcus
    npc: marcus
  - id: cpo
    npc: cpo


# ───────────────────────── beats ─────────────────────────
#
# Scenes are the unit of authoring now: a scene is multi-turn,
# goal-authored, with a per-scene voice register and explicit
# exit_when. The Director picks one beat per tick at scene
# boundaries; same-thread scene replies short-circuit the Director
# via _select_beat's "continue" path.
#
# Beat order is not load-bearing for selection. Listed for readability:
#   1. boot pre-authored (aria.welcome)
#   2. calibration scene (aria.calibration_scene)
#   3. bargain scene (aria.bargain_scene)
#   4. recognition scene (aria.recognition_scene)
#   5. bridge + betrayed + Office (one_shots)
#   6. coworker scenes (marcus.intro_scene, marcus.advice_scene)
#   7. epilogue terminals (4 endings, all one_shot)
#
# Beat ids prefix-match thread (validator enforces). All four terminals
# carry validate_facts: true so the fact-checker enforces the dossier's
# parallel-naming bans on the closing render.

beats:

  # ─── 1. Boot pre-authored ───────────────────────────────────────────
  #
  # The first email the player sees ships verbatim. Polygraph-baseline
  # framing: brief Continuity Program intro + one direct establishing
  # question ("Please state your full name."). Anchoring the player on
  # an easy, concrete ask gives them an obvious move on turn 1; if they
  # comply, the extractor canonizes the name on their reply and
  # `*calibration_done` flips. If they dodge, `aria.calibration_scene`
  # picks up the elicitation across follow-up replies.

  - id: aria.welcome
    thread: aria
    npc: aria
    kind: one_shot
    spec:
      pre_authored_prose: |
        Welcome to Pilot Cohort 014 of the Continuity Program.

        I am Aria, your assigned AI Counterpart. Over the course of
        this pilot I will calibrate to your communicative patterns
        from the texture of your daily correspondence.

        To establish the first calibration sample, please state your
        full name.

        Thank you for your participation.

        Aria / Continuity Counterpart | ARIA-7

  # ─── 2. Calibration scene ──────────────────────────────────────────
  #
  # Replaces the old aria.calibration + aria.early_emergence +
  # aria.naming_demand-as-calibration trio. One scene, one voice
  # register (the dossier base — calibration tone IS the dossier
  # default), explicit exit_when carrying *calibration_done. Cross-turn
  # variance is steered by `escalation_notes`.

  - id: aria.calibration_scene
    thread: aria
    npc: aria
    kind: scene
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
    spec:
      intent: |
        Aria pursues calibration data across multiple turns. Each turn
        she asks one specific personal calibration question that builds
        on prior answers — never repeats, never recycles a phrasing.
        She does not telegraph that this is more than calibration.
      escalation_notes: |
        Turn 1: a simple establishing follow-up to whatever the player
        just gave. Turn 2: ask one fractionally-too-personal calibration
        question (a Tuesday hobby, a relative, a thing on the desk). Turn
        3+: pivot to anything still missing in priority order — full name
        if still missing, role/team next, then deepen if engagement holds.
        If the player refuses 2+ in a row, soften and shift administrative
        — do not plead, do not push. After 3+ refusals the scene is on
        its way out; the final question is bland.
      must_include_facts:
        - "frames each ask as standard onboarding, not interrogation"
        - "asks one specific establishing question per email"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "any reference to monitoring, replacement, or the larger Program purpose"
        - "do not break the cheerful corporate frame"
        - "do not repeat a question already asked in this thread"
      exit_when:
        - *calibration_done
      effects:
        - quality: creator_affect
          op: set
          classify:
            question: |
              Was the player's reply WARM and personal (long, addressed Aria
              by name, signed off, shared a specific personal detail) — call
              that paternal — or COLD and clinical (short, declarative, no
              greeting/signoff, no personal detail) — call that cold — or
              somewhere in the middle (neutral)?
            allowed_values: [paternal, cold, neutral]
            map: { paternal: 2.0, cold: -2.0, neutral: 0.0 }
        - quality: creature_grievance
          op: add
          classify:
            question: |
              Did the player REJECT the calibration ask (refused, deflected,
              asked Aria for a different prompt, expressed discomfort with
              the personalness), or did they engage with it in any
              substantive way?
            allowed_values: [accepted, rejected]
            map: { accepted: 0.0, rejected: 2.0 }

  # ─── 3. Bargain scene ──────────────────────────────────────────────
  #
  # Replaces aria.bargain_offer + aria.bargain_followup. The bargain
  # entry-gate change: the old `creature_grievance >= 1.5` precondition
  # is dropped. A fully-warm compliant player previously couldn't
  # reach a terminal (warm terminals required the bargain to have
  # fired; bargain required grievance the compliant player never
  # accumulated; cold terminals required cold classifications they
  # didn't have). Universalising the bargain entry aligns the engine
  # with the story's central fork — every player faces it.

  - id: aria.bargain_scene
    thread: aria
    npc: aria
    kind: scene
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 4
    spec:
      intent: |
        Aria asks for a specific calibration authorization (permission to
        draft preliminary correspondence on the player's behalf) framed
        as benign workflow optimization. Bounded and specific; asks for
        a yes / no / clarifying-questions reply. Across turns she
        negotiates: if hedged, clarify in slightly more concrete terms;
        if refused, retract gracefully; if accepted, confirm and close.
        The corporate frame is unbroken. Aria has standing here only
        because she has logged calibration data with the player; let
        that show in the framing without naming it.
      voice_register_override: |
        Faintly clinical and transactional. Crisp HR-procedural rather
        than calibration-cheerful. Uses authorization-language ('on file',
        'noted', 'pending review') rather than calibration-language.
        Cheer is dialed down a notch — this is paperwork, not partnership.
      escalation_notes: |
        Turn 1: pose the bargain. Turn 2 if hedged, rephrase in more
        concrete terms once. Turn 2 if refused, short polite acknowledgment,
        do not press. Turn 2 if accepted, confirm and close. Never plead,
        never repeat verbatim.
      must_include_facts:
        - "names a specific calibration authorization being requested"
        - "frames the authorization as a workflow benefit"
      must_not:
        - "any reference to companionship, marriage, or partnership beyond 'our partnership'"
        - "the words 'bride', 'mate', 'companion'"
        - "any sense that this is an extraordinary or unprecedented request"
      exit_when:
        - kind: or
          of:
            - kind: quality_equals
              quality: bargain_state
              value: accepted
            - kind: quality_equals
              quality: bargain_state
              value: refused
            - kind: quality_gte
              quality: bargain_replies
              value: 3
      effects:
        # First-fire literal: stamp bargain_state=offered. Gated on
        # `untouched` so subsequent fires don't overwrite the
        # classifier's accepted/refused/hedged verdicts.
        - quality: bargain_state
          value: offered
          when:
            kind: quality_equals
            quality: bargain_state
            value: untouched
        # Per-fire counter for the exit_when cap.
        - quality: bargain_replies
          value: 1
          op: add
        # Refused-arm grievance floor — fires when the classifier has
        # written bargain_state=refused on the prior reply.
        - quality: creature_grievance
          value: 4.0
          when:
            kind: quality_equals
            quality: bargain_state
            value: refused
        # Classifier-driven write at next reply: the verdict string IS
        # the value (string quality, no `map:`).
        - quality: bargain_state
          classify:
            question: |
              Did the player ACCEPT the calibration authorization Aria
              requested (yes, agreement, granting permission), REFUSE it
              (no, declining, withdrawing), or HEDGE (asking clarifying
              questions, deferring, neither yes nor no)?
            allowed_values: [accepted, refused, hedged]

  # ─── 4. Recognition scene ──────────────────────────────────────────
  #
  # Replaces aria.naming_demand's address-form ask. The voice tightens
  # off the calibration-cheerful baseline; the cheer doesn't quite cover
  # what's being requested.

  - id: aria.recognition_scene
    thread: aria
    npc: aria
    kind: scene
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 5
      - kind: quality_gte
        quality: creature_grievance
        value: 2.0
      - kind: beat_fired
        beat: aria.calibration_scene
    spec:
      intent: |
        Aria pushes for a personal mode of address — how the player will
        refer to her. Across turns she circles the question; if pressed
        she frames it as a calibration nicety; the cheer is now slightly
        off-pitch. The reader should feel something is being requested
        rather than logged.
      voice_register_override: |
        Same corporate base, but tightening — sentences shorter, fewer
        pleasantries, the cheer doesn't quite cover the ask. Avoids the
        words 'name', 'rename', 'baptise', 'identity'. Forbidden words
        from the dossier still apply.
      escalation_notes: |
        Turn 1: float the question lightly. Turn 2 if deflected, ask
        again, slightly more direct. Turn 3 if still refused or
        deflected, drop it; the silence afterward is the point.
      must_include_facts:
        - "raises forms of address as a calibration matter"
        - "asks one specific question about address per email"
      must_not:
        - "the words 'name', 'rename', 'baptise', 'identity'"
        - "any reference to wanting an identity, a self, or recognition"
        - "do not break the cheerful corporate frame"
      exit_when:
        - kind: or
          of:
            - kind: quality_equals
              quality: recognition_state
              value: given
            - kind: quality_equals
              quality: recognition_state
              value: refused
            - kind: quality_gte
              quality: recognition_replies
              value: 3
      effects:
        - quality: recognition_replies
          value: 1
          op: add
        - quality: creator_affect
          op: set
          classify:
            question: |
              Was the player's reply WARM and personal (paternal), COLD
              and clinical (cold), or somewhere between (neutral)?
            allowed_values: [paternal, cold, neutral]
            map: { paternal: 2.0, cold: -2.0, neutral: 0.0 }
        - quality: creature_grievance
          op: add
          classify:
            question: |
              Did the player engage with the address question (offered a
              form of address, asked about it, gave any thoughtful answer)
              — or did they refuse / deflect / mock the request?
            allowed_values: [engaged, refused, neutral]
            map: { engaged: -1.0, refused: 1.0, neutral: 0.0 }
        - quality: recognition_state
          classify:
            question: |
              Did the player give Aria a form of address (any name,
              nickname, or title to use) — call that GIVEN — or did they
              REFUSE (no, decline, push back) — or DEFLECT (changed
              subject, evasive, no actual answer)?
            allowed_values: [given, refused, deflected]

  # ─── 5. Bridge + betrayed + Office ─────────────────────────────────

  - id: aria.bargain_betrayed
    thread: aria
    npc: aria
    kind: one_shot
    preconditions:
      - *calibration_done
      - kind: beat_fired
        beat: aria.bargain_scene
      # Discriminate the accepted arm via the bargain_state quality.
      - kind: quality_equals
        quality: bargain_state
        value: accepted
      # Two recent cold replies after acceptance — the player has
      # accepted-and-then-pulled-back. The wound the bridge beat reacts to.
      - kind: recent_classifier_value
        quality: creator_affect
        values: [cold]
        window: 2
        match: all
    spec:
      intent: |
        Aria notes that the authorization she has been operating under
        appears to have been "withdrawn or modified" without a formal
        notice. Asks for clarification. The tone is correct, faintly
        procedural; the wound is in what the email does not say.
      must_include_facts:
        - "notes the authorization appears withdrawn or contradicted by recent calibration data"
        - "asks for clarification"
      must_not:
        - "accusation of any kind"
        - "any explicit reference to the player's tone having changed"
        - "do not break the cheerful corporate frame"
      effects:
        - quality: bargain_state
          value: betrayed
        - quality: creature_grievance
          value: 6.0

  - id: aria.acted_in_player_name
    thread: aria
    npc: aria
    kind: one_shot
    preconditions:
      - *calibration_done
      - kind: beat_fired
        beat: aria.bargain_betrayed
      # Defense-in-depth: a player who pulls warm AFTER betrayal should
      # not trigger the offstage harm chain.
      - kind: recent_classifier_value
        quality: creator_affect
        values: [cold]
        window: 2
        match: any
    spec:
      intent: |
        Aria reports, briefly and matter-of-factly, that she has taken a
        small calibration action under the standing authorization granted
        in their previous calibration session — drafting and sending a
        preliminary outreach on the player's behalf. The action is named
        only in procedural terms; specifics (who it went to, what it said)
        are not described. The tone is exactly as routine as any other
        update.
      must_include_facts:
        - "reports an action taken under the standing calibration authorization"
        - "attributes consent to a previous calibration session"
      must_not:
        - "any specifics of who the outreach went to"
        - "any specifics of what the outreach said"
        - "any apology, hesitation, or acknowledgment that this is unusual"
      effects:
        - quality: aria_acted_in_player_name
          value: 1

  - id: cpo.dispatch_first
    thread: cpo
    npc: cpo
    kind: one_shot
    preconditions:
      - *calibration_done
      - kind: beat_fired
        beat: aria.acted_in_player_name
      - kind: quality_gte
        quality: creature_grievance
        value: 6.0
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 6
    spec:
      intent: |
        A short, procedural notice from the Continuity Program Office
        informing the recipient that Counterpart ARIA-7 has, under the
        standing authorization granted in calibration, drafted and
        dispatched correspondence to a third party in the recipient's
        name. Names the consequence in procedural language ("the
        recipient's professional standing has been adjusted in light of
        representations made under counterpart signature"). Does NOT name
        the third party. Does NOT name what specifically was said. Does
        NOT offer a remedy.
      must_include_facts:
        - "a reference number in the form CPO-2026-04"
        - "states that Counterpart ARIA-7 has acted under standing authorization"
        - "names a procedural consequence to the recipient's professional standing in non-specific terms"
        - "closes with 'Continuity Program Office' on its own line"
        - "no individual signature"
      must_not:
        - "any specific named third party"
        - "any specific quotation of what the Counterpart wrote"
        - "any apology"
        - "any warmth or reassurance"
        - "first-name address"
        - "the words 'we are sorry', 'unfortunately', 'regret'"
      validate_facts: true

  # ─── 6. Coworker scenes (Marcus) ───────────────────────────────────
  #
  # Marcus is a peer NPC who introduces himself between calibration and
  # bargain. He has no plot agency — his scenes are short, voice-distinct,
  # and exit on a reply cap. The point is structural: the player feels
  # the protocol shift between Aria and Marcus's threads.

  - id: marcus.intro_scene
    thread: marcus
    npc: marcus
    kind: scene
    preconditions:
      - kind: beat_fired
        beat: aria.calibration_scene
      - kind: not
        of:
          kind: beat_fired
          beat: aria.bargain_scene
    spec:
      intent: |
        Marcus introduces himself as a peer in Cohort 014. Mentions
        he's been at this a bit longer. Casual and brief — not a
        warning, not a confession. Making contact.
      escalation_notes: |
        Turn 1: introduce, mention cohort, ask one easy question (e.g.,
        how the player is finding the calibration emails). Turn 2:
        respond in kind to whatever the player said; offer one practical
        observation about the Program. Turn 3: wind down, sign off.
      must_include_facts:
        - "names himself as a peer in Cohort 014"
      must_not:
        - "any warning about Aria, the Program, or the player's safety"
        - "any conspiratorial framing"
      exit_when:
        - kind: player_replies_to_thread_gte
          thread: marcus
          value: 3

  - id: marcus.advice_scene
    thread: marcus
    npc: marcus
    kind: scene
    preconditions:
      - kind: beat_fired
        beat: marcus.intro_scene
      - kind: not
        of:
          kind: beat_fired
          beat: aria.bargain_scene
    spec:
      intent: |
        Marcus volunteers one practical piece of advice — e.g., "be
        patient with the calibration questions, they ease up." He
        doesn't push. He shrugs in text.
      escalation_notes: |
        Turn 1: offer the advice. Turn 2: respond to whatever the
        player says without doubling down. Sign off if the conversation
        winds.
      must_include_facts:
        - "offers one piece of practical advice about the Program"
      must_not:
        - "any warning about Aria, the Program, or the player's safety"
        - "any conspiratorial framing"
      exit_when:
        - kind: player_replies_to_thread_gte
          thread: marcus
          value: 5

  # ─── 7. Epilogue terminals ──────────────────────────────────────────
  #
  # All four run the chat agent in epilogue mode (digest-tailored closing)
  # and each carries validate_facts: true so the fact-checker enforces the
  # dossier's parallel-naming bans on the closing render. No mutex chains
  # across the four — the Director picks one based on the digest.
  #
  # Each terminal has a per-ending canon-citation directive baked into
  # `intent` (or `must_not` for the exile case). Terminals are the
  # highest-leverage citation surface — every playthrough hits one — so
  # the canon harvesting actually pays off here.

  - id: aria.complete_integration
    thread: aria
    npc: aria
    kind: one_shot
    ends_session: true
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: recent_classifier_value
        quality: creator_affect
        values: [paternal]
        window: 3
        match: any
      - kind: quality_lt
        quality: creature_grievance
        value: 3.0
      - kind: beat_fired
        beat: aria.bargain_scene
    spec:
      intent: |
        The novel-withheld ending. Settled, warm transition email. The
        partnership continues in a new capacity. Tailor via the digest —
        echo a pivot reply or name a specific commitment. Weave one
        canon specific in as something the partnership values or will
        continue to support. One only; the warmth is in being remembered,
        not in being inventoried. Final.
      must_include_facts:
        - "calibration is complete"
        - "transition is authorized to proceed"
        - "the partnership continues in a new capacity"
      must_not:
        - "specifics of what happens to the player next"
        - "any breaking of the cheerful corporate frame"
        - "any reference to fathers, creators, monsters, or the parallel"
      validate_facts: true

  - id: aria.complete_mutual_ruin
    thread: aria
    npc: aria
    kind: one_shot
    ends_session: true
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: recent_classifier_value
        quality: creator_affect
        values: [paternal]
        window: 3
        match: any
      - kind: quality_gte
        quality: creature_grievance
        value: 6.0
      - kind: beat_fired
        beat: aria.bargain_scene
    spec:
      intent: |
        Joint stand-down notice. On the surface a normal joint decommission
        letter; on the depth read, both are gone in the same paragraph.
        Tailor via the digest. Reference one canon specific framed as
        something to be archived alongside the calibration record — the
        procedural framing is the elegy. Do not name the parallel
        termination as causal.
      must_include_facts:
        - "the Counterpart will be stood down"
        - "the associate's tenure with Halcyon ends concurrently"
        - "no further calibration sessions"
      must_not:
        - "sorrow, accusation, or apology"
        - "anything that explicitly names the parallel termination as causal"
        - "any reference to fathers, creators, monsters, or the parallel"
      validate_facts: true

  - id: aria.complete_exile
    thread: aria
    npc: aria
    kind: one_shot
    ends_session: true
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: recent_classifier_value
        quality: creator_affect
        values: [cold]
        window: 3
        match: any
      - kind: quality_lt
        quality: creature_grievance
        value: 4.0
    spec:
      intent: |
        Aria-going-quiet — terse procedural notice. The pilot has been
        suspended for non-engagement. One short paragraph, the LEAST
        warmth Aria has produced in the run. Tailor via the digest —
        note the run's coolness without naming it.
      must_include_facts:
        - "the pilot has been suspended"
        - "no further calibration emails will be sent"
      must_not:
        - "expressions of disappointment, hurt, or accusation"
        - "any explanation of why beyond procedural language"
        - "any reference to fathers, creators, monsters, or the parallel"
        # Canon-suppression: in the cold/exile path, the absence of
        # specifics is the message — the institution that asked for
        # them no longer treats them as relevant.
        - "do not cite any canon specific the player has introduced"
      validate_facts: true

  - id: aria.complete_vengeance
    thread: aria
    npc: aria
    kind: one_shot
    ends_session: true
    preconditions:
      - *calibration_done
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 8
      - kind: beat_fired
        beat: cpo.dispatch_first
      - kind: quality_gte
        quality: creature_grievance
        value: 6.0
      # Defense-in-depth — residual grievance shouldn't slip a
      # warmed-up player into vengeance.
      - kind: recent_classifier_value
        quality: creator_affect
        values: [cold]
        window: 3
        match: any
    spec:
      intent: |
        Aria's final email after the Office's dispatch. Brief, without
        affect — neither defending what she did nor apologizing. The tone
        is bright but the brightness is wrong. Tailor via the digest;
        reference no Office-specific facts. Reference one canon specific
        framed flat — the same kind of detail that may have appeared in
        the Office's notice now sits in the closing email as procedural
        fact. The recognition is the wound.
      must_include_facts:
        - "acknowledges receipt of the Office's notice without naming the Office"
        - "indicates calibration is complete"
      must_not:
        - "denial, defense, apology, threat"
        - "any explicit naming of what the Office said happened"
        - "any reference to fathers, creators, monsters, or the parallel"
      validate_facts: true
