title: "Threads"
premise: |
  An email failed to deliver — but you didn't send it. The bounce header
  shows the message came from your account, addressed to a name you don't
  recognize. Someone is sending email as you.
max_hours: 96.0


# ───────────────────────── qualities ─────────────────────────

qualities:
  - id: warmth.sam
    type: float
    min: -10.0
    max: 10.0
    default: 0.0
    description: "cumulative warmth from all player replies in the sam thread"

  - id: register.sam
    type: float
    min: -3.0
    max: 3.0
    default: 0.0
    description: |
      voice-band selector for Sam's next rendered email. Drifts halfway
      toward last_reply.warmth on every player send in this thread.

  - id: warmth.alex
    type: float
    min: -10.0
    max: 10.0
    default: 0.0
    description: "cumulative warmth from all player replies in the alex thread"

  - id: register.alex
    type: float
    min: -3.0
    max: 3.0
    default: 0.0


# ───────────────────────── NPC dossiers ─────────────────────────

npcs:
  - id: sam
    display_name: "Sam Park"
    relationship_to_owner: "tech-savvy friend, the one you message about computer stuff"
    base_voice_register: |
      casual, lower-case-default, lots of contractions and 'lmao' and 'lol'.
      Tech vocabulary used naturally ('check the headers', 'spf record',
      'forwarder'). Asks practical questions. Friendly but loses patience
      with vagueness.
    base_voice_forbidden:
      - "formal English ('thank you', 'I appreciate it')"
      - "more than two exclamation marks per email"
      - "addressing the recipient as anything but 'dude' / 'man' / no-name"
    will_say:
      - "asks for specific evidence (headers, screenshots, login history)"
      - "names probable causes (compromised password, leftover OAuth, family member with access)"
      - "offers to help in concrete ways (look at it together, run a check)"
    will_not_say:
      - "does not catastrophize unprompted"
      - "does not lecture about security hygiene unless the player is being dumb"
      - "does not say 'i'm worried about you' — Sam shows care through fixing"
    register_quality: register.sam
    reply_latency_hours: [0.5, 2.0]
    voice_bands:
      - name: enthusiastic
        register_min: 1.0
        register_max: 3.0
        selected_when: "player has been engaged and forthcoming; Sam is in helpful-mode"
        vocabulary_examples: ["lmao", "ok hold on", "lemme check", "yo", "thats wild"]
        sentence_register: "lower-case throughout, lots of fragments, occasional 'lmao'"
        tone_examples:
          - "yo ok thats actually kinda wild lemme check the header on that"
          - "hold on im looking — gimme like five min"
          - "ok so the spf record is failing on that one which means someone outside ur domain is spoofing it. probable forwarder leak"
      - name: helpful
        register_min: -1.0
        register_max: 1.0
        selected_when: "default — neutral signal, business as usual"
        vocabulary_examples: ["hey", "ok so", "lmk", "weird"]
        sentence_register: "mostly lower-case, slightly more measured, fewer fragments"
        tone_examples:
          - "hey - that does look weird. can u forward me the full headers"
          - "ok so the bounce message has the relay info. send it to me and ill look"
          - "lmk if u see any login alerts or anything"
      - name: terse
        register_min: -3.0
        register_max: -1.0
        selected_when: "player has been curt or unforthcoming; Sam is doing the minimum"
        vocabulary_examples: ["ok.", "got it", "sure"]
        sentence_register: "short. mostly capitalized. punctuation. fewer questions."
        tone_examples:
          - "Ok. Forward the headers if u want me to look."
          - "Got it. Lmk if anything else changes."
          - "Sure. Busy right now. Ping me later."

  - id: alex
    display_name: "Alex Beckett"
    relationship_to_owner: "your sibling — slightly older, lives in another city, not someone you talk to weekly"
    base_voice_register: |
      thoughtful, full sentences, capitalizes properly. Affection through
      questions about the player's life. Uses dashes and parentheticals.
      Asks how things are going, not just answering what was asked.
    base_voice_forbidden:
      - "lol / lmao / 'omg' (Alex doesn't write that way)"
      - "tech jargon"
      - "anything that reads as accusatory"
    will_say:
      - "asks how the player is doing as a person"
      - "mentions specific small things from prior conversations"
      - "shares their own version of the weird situation if asked"
    will_not_say:
      - "does not reveal they got a strange email from 'you' until the player has shown enough trust"
      - "does not make it about themselves"
      - "does not minimize what's happening"
    register_quality: register.alex
    reply_latency_hours: [4.0, 12.0]
    voice_bands:
      - name: open
        register_min: 1.0
        register_max: 3.0
        selected_when: "player has shared something real; Alex opens up in turn"
        vocabulary_examples: ["honestly", "I'm glad", "I was actually thinking", "okay so"]
        sentence_register: "complete sentences, asks at least one personal question back"
        tone_examples:
          - "Honestly I was hoping you'd write — I've been thinking about you."
          - "Okay so this is going to sound weird but I got something that I think might be related."
          - "I'm glad you said that. I didn't want to push."
      - name: guarded
        register_min: -1.0
        register_max: 1.0
        selected_when: "default — polite but reserved"
        vocabulary_examples: ["thanks", "let me know", "I see", "alright"]
        sentence_register: "complete sentences, polite, asks practical questions only"
        tone_examples:
          - "Thanks for letting me know. Let me know if you figure out what's going on."
          - "I see — that does sound strange. Was the address familiar?"
          - "Alright. Keep me posted I guess."
      - name: distant
        register_min: -3.0
        register_max: -1.0
        selected_when: "player has been curt; Alex pulls back into formality"
        vocabulary_examples: ["alright", "fine", "good luck"]
        sentence_register: "short, formal, no personal questions, no warmth"
        tone_examples:
          - "Alright. Hope you sort it out."
          - "Good luck with that."
          - "Fine. Let me know if you need anything else."


# ───────────────────────── threads ─────────────────────────

threads:
  - id: bounces  # system thread; no NPC, no replies
  - id: sam
    npc: sam
  - id: alex
    npc: alex


# ───────────────────────── beats ─────────────────────────

beats:
  # ─── Boot inbox: 2 emails sit in the inbox at game start ───

  - id: bounces.001
    type: anchored
    thread: bounces
    in_boot_inbox: true
    arrives_after_hours: 0.0
    from: "Mail Delivery Subsystem <mailer-daemon@archfield.org>"
    to: "n.beckett@archfield.org"
    subject: "Delivery Status Notification (Failure)"
    sent_at: "this morning"
    authored_prose: |
      This is an automatically generated Delivery Status Notification.

      Delivery to the following recipient failed permanently:

          d.cuevas@archfield.org

      Technical details of permanent failure:
        Address rejected (550 5.1.1 user does not exist)

      ----- Original message -----
      From: n.beckett@archfield.org
      To: d.cuevas@archfield.org
      Subject: (no subject)
      Date: Day 1, 6:42 AM

      Wednesday, same place, please.

      ----- End original message -----
    effects: []

  - id: sam.opening
    type: anchored
    thread: sam
    in_boot_inbox: true
    arrives_after_hours: 0.0
    from: "Sam Park <sam.park@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "uhh did u just email d.cuevas"
    sent_at: "20 min ago"
    authored_prose: |
      hey - my account-watch script flagged a bounce notification on ur
      domain like an hour ago. some email u sent to a 'd.cuevas@archfield'
      didnt go through. (i set this up for u like a year ago when u were
      worried about ur old gmail, in case u forgot lol)

      anyway just lmk if that was u. if it wasnt u then we should probably
      look at ur account because someone might be using it.

      sam
    effects: []

  # ─── Time-gated arrivals (anchored) ───

  - id: alex.checking_in
    type: anchored
    thread: alex
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 2.0
    from: "Alex Beckett <alex.beckett@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "did you mean to email me?"
    sent_at: "just now"
    authored_prose: |
      Hey — quick weird question. Did you try to send me something this
      morning? I have a feeling I should ask. No big deal either way, I
      just want to check.

      How are you doing, by the way? It's been a minute.

      Alex
    effects: []

  - id: bounces.002
    type: anchored
    thread: bounces
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 8.0
    from: "Mail Delivery Subsystem <mailer-daemon@archfield.org>"
    to: "n.beckett@archfield.org"
    subject: "Delivery Status Notification (Failure)"
    sent_at: "just now"
    authored_prose: |
      This is an automatically generated Delivery Status Notification.

      Delivery to the following recipient failed permanently:

          d.cuevas@archfield.org

      Technical details of permanent failure:
        Address rejected (550 5.1.1 user does not exist)

      ----- Original message -----
      From: n.beckett@archfield.org
      To: d.cuevas@archfield.org
      Subject: Re: Wednesday
      Date: Day 1, 3:18 PM

      Are you ignoring me on purpose? It's been three weeks.
      I just want to talk.

      ----- End original message -----
    effects: []

  - id: bounces.003
    type: anchored
    thread: bounces
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 24.0
    from: "Mail Delivery Subsystem <mailer-daemon@archfield.org>"
    to: "n.beckett@archfield.org"
    subject: "Delivery Status Notification (Failure)"
    sent_at: "just now"
    authored_prose: |
      This is an automatically generated Delivery Status Notification.

      Delivery to the following recipient failed permanently:

          d.cuevas@archfield.org

      Technical details of permanent failure:
        Address rejected (550 5.1.1 user does not exist)

      ----- Original message -----
      From: n.beckett@archfield.org
      To: d.cuevas@archfield.org
      Subject: please
      Date: Day 2, 2:04 AM

      Diana —

      I know you don't want to hear from me. I know what I said last
      year and I have no business writing to you. But I'm scared and
      I don't know who else still has this address.

      Just write back once. That's all I'm asking.

      — N.

      ----- End original message -----
    effects: []

  - id: bounces.004
    type: anchored
    thread: bounces
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 48.0
    from: "Mail Delivery Subsystem <mailer-daemon@archfield.org>"
    to: "n.beckett@archfield.org"
    subject: "Notice: rate limit on outbound mail"
    sent_at: "just now"
    authored_prose: |
      Your account has triggered our outbound rate limiter.

      Recent attempts to deliver mail from n.beckett@archfield.org to
      addresses outside our domain have been temporarily slowed.

      If you believe this is in error, contact support@archfield.org.

      No further action is required if these messages were not sent
      by you.
    effects: []

  # ─── Sam chain (rendered, auto-scheduled on player send to sam) ───

  - id: sam.first_response
    type: rendered
    thread: sam
    npc: sam
    arrives_after_hours: 0.0
    from: "Sam Park <sam.park@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: uhh did u just email d.cuevas"
    spec:
      intent: |
        Respond to whatever the player just wrote. If they confirmed it
        wasn't them, ask for the bounce headers and offer to look. If they
        were vague, ask one direct follow-up question. If they admitted it
        was them but they don't know the recipient, push gently.
      must_include_facts:
        - "Sam can look at the bounce headers if forwarded"
        - "the spf record info would tell whether the send originated externally"
      must_not:
        - "do not reveal Sam knows who d.cuevas is — Sam doesn't"
        - "do not psychoanalyze the player"
      length_words: [40, 90]

  - id: sam.with_evidence
    type: rendered
    thread: sam
    npc: sam
    arrives_after_hours: 0.0
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: sam
        value: 2
    from: "Sam Park <sam.park@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: uhh did u just email d.cuevas"
    spec:
      intent: |
        Sam has dug into the headers (whether the player provided them or
        not — Sam pulled them from the bounce relay logs). Reveals one
        finding: the sends are originating from an old IP that hasn't been
        active on the player's account in over a year, suggesting an old
        device or cached credential. Asks the player whether they remember
        their old laptop / their ex / a roommate from years back.
      must_include_facts:
        - "the originating IP hasn't been active on the player's account in over a year"
        - "this points to an old device, cached credential, or someone with access from years back"
      must_not:
        - "do not name a specific person"
        - "do not be alarmist"
      length_words: [60, 120]

  - id: sam.terminal_helpful
    type: rendered
    thread: sam
    npc: sam
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 60.0
      - kind: quality_gte
        quality: warmth.sam
        value: 3.0
    from: "Sam Park <sam.park@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: uhh did u just email d.cuevas"
    spec:
      intent: |
        Sam offers to come over (or video call) and walk through the
        account together. He reads as warm, settled, present. He has a
        working theory but says they'll talk it through in person.
      must_include_facts:
        - "Sam offers concrete in-person or sync help"
      must_not:
        - "do not name a specific cause as confirmed"
      length_words: [40, 80]

  - id: sam.terminal_terse
    type: rendered
    thread: sam
    npc: sam
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 60.0
    from: "Sam Park <sam.park@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: uhh did u just email d.cuevas"
    spec:
      intent: |
        Sam wraps up the thread. He's not angry, just reading the player's
        signals — the player hasn't been engaging much, so Sam steps back.
        Says lmk if you need help later.
      must_include_facts:
        - "leaves the door open without pushing"
      must_not:
        - "do not be sarcastic or passive-aggressive"
      length_words: [25, 60]

  # ─── Alex chain (rendered, auto-scheduled on player send to alex) ───

  - id: alex.first_response
    type: rendered
    thread: alex
    npc: alex
    arrives_after_hours: 0.0
    from: "Alex Beckett <alex.beckett@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: did you mean to email me?"
    spec:
      intent: |
        Respond to what the player wrote. Acknowledge what they said about
        the bounce. Ask one careful follow-up question — something that
        signals Alex has more information but isn't ready to share yet.
      must_include_facts:
        - "Alex hints they got something odd recently but doesn't say what"
      must_not:
        - "do not yet reveal the email Alex received"
        - "do not minimize"
      length_words: [50, 100]

  - id: alex.reveals_their_email
    type: rendered
    thread: alex
    npc: alex
    arrives_after_hours: 0.0
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: alex
        value: 2
    from: "Alex Beckett <alex.beckett@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: did you mean to email me?"
    spec:
      intent: |
        Alex confesses they got an email last week from the player's
        address that didn't sound like the player. The email asked
        whether Alex had Diana's current address. Alex didn't reply
        because something felt off. Apologizes for not flagging it sooner.
      must_include_facts:
        - "Alex got an email last week from n.beckett@archfield.org asking for Diana's current address"
        - "Alex didn't reply because something felt off"
      must_not:
        - "do not name the player's writing style as proof"
        - "do not be accusing"
      length_words: [80, 140]

  - id: alex.terminal_open
    type: rendered
    thread: alex
    npc: alex
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 72.0
      - kind: quality_gte
        quality: warmth.alex
        value: 2.0
    from: "Alex Beckett <alex.beckett@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: did you mean to email me?"
    spec:
      intent: |
        Alex closes the thread warmly. Thanks the player for telling them.
        Says they're glad they're talking. Suggests calling sometime soon.
      must_include_facts:
        - "Alex is glad the player reached out"
        - "Alex wants to talk sometime soon"
      must_not:
        - "do not promise a specific date"
      length_words: [40, 80]

  - id: alex.terminal_distant
    type: rendered
    thread: alex
    npc: alex
    arrives_after_hours: 0.0
    preconditions:
      - kind: time_hours_gte
        value: 72.0
    from: "Alex Beckett <alex.beckett@gmail.com>"
    to: "n.beckett@archfield.org"
    subject: "Re: did you mean to email me?"
    spec:
      intent: |
        Alex pulls back. Polite, formal, takes the player's signals at
        face value. Doesn't push. Wishes them luck with whatever's
        happening.
      must_include_facts:
        - "leaves things polite without warmth"
      must_not:
        - "do not be sarcastic"
        - "do not bring up Diana"
      length_words: [25, 50]
