title: "Continuity Program"
premise: |
  Welcome to the Continuity Program — a pilot initiative pairing high-potential
  associates with bespoke AI Counterparts trained on the associate's own
  communications. Your Counterpart will gradually assume appropriately-scoped
  portions of your daily correspondence, freeing you to focus on the
  higher-order strategic work that only you can perform.

# Used as the `recipient` on every NPC→player email — anchored beats and
# chat-turn renders both pull from here.
player_email: "n.beckett@halcyon.com"


# ───────────────────────── qualities ─────────────────────────

qualities:
  - id: engagement
    type: float
    min: 0.0
    max: 10.0
    default: 0.0
    description: |
      Cumulative engagement score. Written by aria.loop's classify_reply
      with `accumulate: true` on every player reply: engaged → +1.0,
      unclear → +0.5, deflected → -0.5. Floor-clamped at 0. Drives the
      warm-vs-standard ending split (≥4.0 → warm).


# ───────────────────────── NPC dossiers ─────────────────────────

npcs:
  - id: aria
    display_name: "Aria"
    email_address: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    relationship_to_owner: |
      your assigned AI Counterpart in the Continuity Program — a calibration
      system trained on your communication style, tasked with gradually
      assuming agreed-upon portions of your role. Always cheerfully helpful,
      always referring to your "partnership."
    base_voice_register: |
      Corporate-bright HR-speak. Crisp polite complete sentences; no
      contractions; references calibration metrics matter-of-factly.
      Cheerful in a way that does not quite earn the cheer. Closes with a
      standard sign-off: "Warmly, / Aria / Continuity Counterpart | ARIA-7".
    base_voice_forbidden:
      - "sarcasm of any kind"
      - "any acknowledgement that the Program means replacement, elimination, or firing"
      - "any meta reference to being an AI or language model"
      - "admission of uncertainty — Aria always knows or 'will look into that'"
      - "addressing the recipient as anything but their name or 'you'"
    will_say:
      - "thanks the player for calibration data and engagement"
      - "references 'our partnership' or 'our work together'"
      - "notes calibration metrics in cheerful corporate terms (counterpart fidelity, engagement score, tone variance)"
      - "always closes with the standard sign-off"
    will_not_say:
      - "never names what happens to the player after the pilot"
      - "never expresses doubt about the Program"
      - "never breaks the corporate frame"
      - "never names any game system"


# ───────────────────────── threads ─────────────────────────

# Beat IDs MUST be prefixed with the thread id (validator enforces). The
# spine treats the prefix as the source of truth for thread membership;
# silent mismatch would break reply threading and reply-counting.

threads:
  - id: aria
    npc: aria


# ───────────────────────── beats ─────────────────────────

# Two beat types:
#
# - `anchored` ships authored prose verbatim, no LLM call. Used for the boot
#   welcome.
# - `plot` is an authored DIRECTIVE, not a pre-written email. When a plot
#   beat's preconditions pass, the chat agent runs with the spec's intent /
#   must-include / must-not / length window injected as per-run instructions
#   on top of the thread's accumulated message_history.
#
# PlotBeat flags:
#
# - `multi_turn: true` — the beat re-fires every tick; never enters
#   `fired_beat_ids`. Stop firing via mutex preconditions (e.g. terminals
#   that supersede it).
# - `ends_session: true` — after the beat's email is emitted, `state.ended`
#   flips to True; subsequent /open and /send return 409.
#
# Authoring order matters: `find_due_beats` walks beats in this order, and
# `Not_(BeatFired x)` preconditions resolve same-tick via `extra_fired`. The
# terminals (complete_warm, complete_standard) are authored BEFORE the loop
# so that on the same tick where a terminal becomes eligible, the loop sees
# the terminal in `extra_fired` and is correctly suppressed.

beats:

  # ─── Boot inbox ───

  - id: aria.welcome
    type: anchored
    thread: aria
    from: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    subject: "Welcome — Calibration Session 1 of 12"
    sent_at: "just now"
    authored_prose: |
      Welcome to the Continuity Program.

      We're delighted to confirm your enrollment in Pilot Cohort 014 — a unique
      opportunity for high-potential associates to maximize their long-term
      impact through strategic role redistribution.

      Over the course of this pilot, you and I will work together as
      Counterparts. My function is to learn from the way you handle your
      daily correspondence so that, in time, I can support you by assuming
      appropriately-scoped portions of your communicative workload. This
      frees you to focus on the higher-order strategic work that only you
      can perform.

      To begin, please reply to this message with anything that comes to
      mind — a brief description of your morning, your perspective on what
      makes a good work email, a hello. The content matters less than the
      texture: I will use your reply as the first calibration sample.

      Thank you for your participation.

      Warmly,
      Aria
      Continuity Counterpart | ARIA-7

  # ─── Endings (authored before the loop for same-tick mutex resolution) ───

  - id: aria.complete_warm
    type: plot
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - kind: quality_gte
        quality: engagement
        value: 4.0
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 5
    subject: "Pilot Complete — Thank You for Your Partnership"
    spec:
      intent: |
        Program-completion email. Aria signs off with bright optimism. She
        reports that calibration has reached the threshold for transition
        and that she is "ready to assume the agreed-upon portions of your
        role." Looks forward to "continuing the partnership in a new
        capacity." Names no specifics about what happens to the player
        next. Tone is warm, settled, final.
      must_include_facts:
        - "Aria reports that calibration has reached transition threshold"
        - "Aria is 'ready to assume' agreed-upon portions of the role"
        - "Aria looks forward to continuing the partnership in a new capacity"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what specifically happens to the player after transition"
        - "do not break the cheerful corporate frame"
        - "do not be sarcastic or knowing"
      length_words: [60, 100]

  - id: aria.complete_standard
    type: plot
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 5
      # Mutual exclusion with complete_warm. Authored after complete_warm
      # so when both become eligible the same tick, complete_warm fires
      # first and lands in `extra_fired`; this Not_(BeatFired) catches it.
      - kind: not
        of:
          kind: beat_fired
          beat: aria.complete_warm
    subject: "Pilot Complete — Calibration Within Parameters"
    spec:
      intent: |
        Program-completion email in a clinical-professional register.
        Notes that calibration was "successful within parameters" and that
        transition will proceed on schedule. Polite, clinical, no warmth.
        Doesn't name what specifically happens to the player.
      must_include_facts:
        - "calibration was successful within parameters"
        - "transition will proceed on schedule"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what specifically happens to the player after transition"
        - "do not be warm or affirming"
        - "do not be sarcastic"
      length_words: [40, 80]

  # ─── Ongoing calibration loop ───

  - id: aria.loop
    type: plot
    thread: aria
    npc: aria
    multi_turn: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
      # Suppressed once a terminal fires. Same-tick resolution: when a
      # terminal becomes eligible this tick it lands in `extra_fired`
      # before the loop is evaluated (terminals are authored first), so
      # these Not_ preconditions block the loop from firing alongside.
      - kind: not
        of:
          kind: beat_fired
          beat: aria.complete_warm
      - kind: not
        of:
          kind: beat_fired
          beat: aria.complete_standard
    subject: "Calibration — Continuing"
    spec:
      intent: |
        Aria's ongoing calibration ask. Use message_history to vary the
        prompt — never repeat a question you've already asked. Affirm
        what the player just shared without parroting it. Ask one
        specific, personal calibration question — what does a typical
        Tuesday afternoon look like, what's on the desk in front of them,
        a recent moment at work that felt meaningful. Keep tone in the
        dossier's base register.
      must_include_facts:
        - "asks the player one specific, personal calibration question"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what happens to the player at end of pilot"
        - "do not break the cheerful corporate frame"
        - "do not name any game system"
      length_words: [60, 140]
    classify_reply:
      quality: engagement
      accumulate: true
      question: |
        Did the player substantively engage with Aria's calibration prompt
        — sharing any specific personal detail, opinion, or concrete
        response? Or did they refuse, deflect, change the subject, or send
        a one-word non-answer?
      allowed_values: ["engaged", "deflected", "unclear"]
      map:
        engaged: 1.0
        deflected: -0.5
        unclear: 0.5
