title: "Test Scenario"
premise: |
  Synthesised scenario used by test_app.py and test_history_compaction.py.
  Same shape as the old Continuity Program pilot — engagement quality,
  welcome anchored, multi-turn loop with one classifier axis, two
  mutex-chained terminals. Decoupled from the production scenario so
  app-wiring tests stay focused on engine plumbing rather than story
  content.

player_email: "n.beckett@halcyon.com"

qualities:
  - id: engagement
    type: float
    min: 0.0
    max: 10.0
    default: 0.0
    description: |
      Cumulative engagement score. Written by aria.loop's classify_reply
      with `accumulate: true` on every player reply: engaged → +1.0,
      unclear → +0.5, deflected → -0.5. Drives the warm-vs-standard
      ending split (≥4.0 → warm).

npcs:
  - id: aria
    display_name: "Aria"
    email_address: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    relationship_to_owner: |
      assigned AI Counterpart in the Continuity Program calibration pilot.
    base_voice_register: |
      Corporate-bright HR-speak. Crisp polite complete sentences; no
      contractions. Closes with "Warmly, / Aria / Continuity Counterpart | ARIA-7".
    base_voice_forbidden:
      - "sarcasm of any kind"
      - "any meta reference to being an AI or language model"
      - "any acknowledgement that the Program means replacement"
    will_say:
      - "thanks the player for calibration data"
      - "always closes with the standard sign-off"
    will_not_say:
      - "never names what happens to the player after the pilot"
      - "never breaks the corporate frame"

threads:
  - id: aria
    npc: aria

beats:
  - id: aria.welcome
    type: anchored
    thread: aria
    from: "Aria | Continuity Program <aria.7@continuity.halcyon.com>"
    subject: "Welcome — Calibration Session 1 of 12"
    sent_at: "just now"
    authored_prose: |
      Welcome to the Continuity Program.

      Please reply to this message with anything that comes to mind — a
      brief description of your morning, your perspective on what makes a
      good work email, a hello. The content matters less than the texture.

      Warmly,
      Aria
      Continuity Counterpart | ARIA-7

  - id: aria.complete_warm
    type: plot
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - kind: quality_gte
        quality: engagement
        value: 4.0
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 5
    subject: "Pilot Complete — Thank You for Your Partnership"
    spec:
      intent: |
        Warm completion email. Aria reports calibration has reached the
        threshold for transition. Looks forward to continuing the
        partnership in a new capacity.
      must_include_facts:
        - "calibration has reached transition threshold"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what specifically happens to the player after transition"

  - id: aria.complete_standard
    type: plot
    thread: aria
    npc: aria
    ends_session: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 5
      - kind: not
        of:
          kind: beat_fired
          beat: aria.complete_warm
    subject: "Pilot Complete — Calibration Within Parameters"
    spec:
      intent: |
        Clinical completion email. Notes calibration was successful within
        parameters and transition will proceed on schedule. No warmth.
      must_include_facts:
        - "calibration was successful within parameters"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not be warm or affirming"

  - id: aria.loop
    type: plot
    thread: aria
    npc: aria
    multi_turn: true
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
      - kind: not
        of:
          kind: beat_fired
          beat: aria.complete_warm
      - kind: not
        of:
          kind: beat_fired
          beat: aria.complete_standard
    subject: "Calibration — Continuing"
    spec:
      intent: |
        Aria's ongoing calibration ask. Affirm what the player just shared,
        then ask one specific personal calibration question.
      must_include_facts:
        - "asks the player one specific, personal calibration question"
        - "Aria signs off as 'Aria / Continuity Counterpart | ARIA-7'"
      must_not:
        - "do not name what happens to the player at end of pilot"
    classify_reply_axes:
      - quality: engagement
        accumulate: true
        question: |
          Did the player substantively engage with Aria's calibration
          prompt — sharing any specific personal detail, opinion, or
          concrete response? Or did they refuse, deflect, change the
          subject, or send a one-word non-answer?
        allowed_values: ["engaged", "deflected", "unclear"]
        map:
          engaged: 1.0
          deflected: -0.5
          unclear: 0.5
