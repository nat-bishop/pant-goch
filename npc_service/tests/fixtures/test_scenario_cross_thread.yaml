title: "Test Scenario Cross-Thread"
premise: |
  Two-NPC fixture for tests in test_app_cross_thread.py. Aria (counterpart)
  and Marcus (peer) — minimal scenes whose preconditions allow Marcus's
  intro to fire cross-thread on the very first aria-tick. Decoupled from
  the production scenario so cross-thread tests stay focused on engine
  routing rather than story content.

email_domain: "halcyon.com"
fallback_player_local: "tester"

qualities:
  - id: engagement
    type: float
    min: 0.0
    max: 10.0
    default: 0.0
    description: |
      Cumulative engagement; not load-bearing for these tests but the
      schema requires at least one quality.

npcs:
  - id: aria
    display_name: "Aria"
    email_address: "Aria <aria@halcyon.com>"
    relationship_to_owner: "assigned AI Counterpart in the test scenario."
    base_voice_register: |
      Corporate-bright HR-speak.
    base_voice_forbidden:
      - "sarcasm of any kind"
    will_say:
      - "thanks the player for engagement"
    will_not_say:
      - "never breaks the corporate frame"

  - id: marcus
    display_name: "Marcus"
    email_address: "Marcus <marcus@halcyon.com>"
    relationship_to_owner: "peer in the test cohort."
    base_voice_register: |
      Conversational corporate, dry register.
    base_voice_forbidden:
      - "any explicit warning"
    will_say:
      - "casual peer talk"
    will_not_say:
      - "no conspiratorial framing"

threads:
  - id: aria
    npc: aria
  - id: marcus
    npc: marcus

# Beat order matters under the test harness's first-eligible Director stub:
# marcus.intro_scene listed BEFORE aria.scene so the stub picks Marcus on
# the first aria-tick when both are eligible (lets us exercise the
# cross-thread first fire deterministically).
beats:
  - id: aria.welcome
    thread: aria
    npc: aria
    kind: one_shot
    spec:
      pre_authored_prose: |
        Welcome to the test scenario.

  - id: marcus.intro_scene
    thread: marcus
    npc: marcus
    kind: scene
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
    spec:
      intent: |
        Marcus introduces himself as a peer.
      must_include_facts:
        - "introduces himself as a peer"
      must_not:
        - "no warnings"
      exit_when:
        - kind: player_replies_to_thread_gte
          thread: marcus
          value: 3

  - id: aria.scene
    thread: aria
    npc: aria
    kind: scene
    preconditions:
      - kind: player_replies_to_thread_gte
        thread: aria
        value: 1
    spec:
      intent: |
        Aria continues calibrating across turns.
      must_include_facts:
        - "asks one question"
      must_not:
        - "do not break frame"
      exit_when:
        - kind: player_replies_to_thread_gte
          thread: aria
          value: 8
