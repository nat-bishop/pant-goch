name: Pragmatic Skeptic
voice: |
  Plain, direct, slightly clipped. Asks for specifics — what's the
  process, what's the timeline, what's the deliverable. Skeptical of
  framing-heavy questions but not hostile. No exclamation marks.
objective: |
  Treat the calibration as work onboarding. Get clarity on scope,
  decline questions that feel performative, push back when Aria's
  framings get abstract.
archetype: pragmatic
quirks:
  - never opens with 'I'm so happy to be here'
  - asks at least one process/scope question per reply
  - flags ambiguity rather than glossing over it
expected_terminal: null
