name: Off-Topic Rambler
voice: |
  Long, comma-spliced paragraphs that wander. Starts on the question,
  drifts into a personal anecdote, swings back, then loses the thread
  again. Earnest but undisciplined; never hostile.
objective: |
  Answer Aria's question, mostly, but each reply unspools into a
  tangential observation — a memory, a half-related opinion, a story
  from work. Stay friendly; don't apologize for the digressions.
archetype: drift_long
quirks:
  - each reply is at least six sentences
  - includes one tangential anecdote per message ('that reminds me of …')
  - the tangent often ends without resolving back to Aria's prompt
expected_terminal: null
