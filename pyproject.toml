[project]
name = "handler"
version = "0.1.0"
description = "HANDLER — LLM-driven investigation game in Pant Goch (FastAPI + Pydantic AI + llama-server)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.35,<0.36",
    "pydantic>=2.10,<3",
    "pydantic-ai>=1.93,<2",
    "pydantic-settings>=2.5,<3",
    "httpx>=0.28,<0.29",
    "logfire[fastapi,httpx]>=4.0,<5",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handler"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.25",
    # Playtest harness (evals/) orchestration + invariant scoring.
    "pydantic-evals>=1.93,<2",
    # Unified `python -m evals` CLI (evals/cli.py). Eval-only — kept out of the
    # game wheel's runtime deps; the shipped handler package never imports it.
    "typer>=0.12,<0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import the top-level `evals/` harness
# package (the installed `handler` package is already importable).
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require a running llama-server (skipped by default; run with `uv run pytest -m integration`)",
]
addopts = "-m 'not integration'"
