<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continuity Program</title>
    <!-- Set theme class on <html> BEFORE the JS bundle parses to prevent a
         50–200ms flash of the wrong theme on first paint. Don't move into
         main.tsx — by the time React mounts, the page has already painted. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved === "light" || saved === "dark"
            ? saved
            : prefersDark
              ? "dark"
              : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
