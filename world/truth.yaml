# The truth of Pant Goch. The LLM reads this once at startup and is briefed
# on what's real. The model never has to "figure out" the mystery; it knows.
#
# QUALITY ENGINE (see plan: dissolve the beat-DAG into a quality vector):
#   - Relationship progress is NOT a ladder of beats. It is per-NPC `trust`
#     and `guard` (engine state). The LLM nudges them ±1/turn; the engine
#     derives confession DEPTH bands (cold→thawing→open→at_peace) from them.
#   - Most beats here are EVIDENCE/OUTCOME milestones the ENGINE derives the
#     moment a `when` gate is met — they cannot be mis-fired, because they
#     fall out of the trust the player actually earned. They carry `when`.
#   - A handful are LLM-emitted (`commitment: true`): the player's explicit
#     choices (decided_*) and two observation milestones (reading the letter,
#     standing at the crash site) that fire on a location, not on a person
#     opening up.
#   - The four `decided_*` beats are mutually exclusive (engine rule: at most
#     one decision per playthrough).
#   - Negative beats, ladder rungs, and run_out's count machinery are GONE:
#     a rupture is `guard` latching (BREACH); the village running you out is
#     `village_attention` reaching `hostile`.

crime: |
  Megan Pritchard, 19, died on the night of 14 March 2019 on the Black
  Dog Bend of the B4368. The official record says single-vehicle
  accident, blood-alcohol just over the limit. The official record is
  wrong about both.

  Megan had been in a secret relationship with Dylan Vaughn (her
  childhood friend, then 21) for about a year. The Vaughn family had
  an informal understanding that Dylan would marry Lowri Bevan (Tom's
  grand-niece, who lives in Llanidloes) to consolidate two adjacent
  farms. Eluned Vaughn discovered the affair in February 2019. She
  gave Dylan an ultimatum: end it, or lose the farm.

  The night of 14 March, Megan drove out to Tan-y-coed to confront
  Dylan after he had been avoiding her. There was a fight in the yard.
  She left in tears. Eluned, drunk and furious, took the Land Rover
  and followed her down the B4368 — meaning to confront her face to
  face, not to kill her.

  On the Black Dog Bend the Land Rover came too close to Megan's car.
  Megan oversteered. The Mini went off the road into the ditch and
  rolled. She died on impact. Eluned did not stop. She drove back to
  the farm. She has not slept since.

  Tom Bevan was on the same road, going the other direction, and saw
  the Land Rover speeding away from the bend. He recognised it. He
  told the police he had seen "a vehicle" and never said more.

  DC Helen Mortimer of Knighton suspected Eluned but had nothing
  usable — Tom's vague statement, no forensics on a vehicle never
  examined, the village's solid silence. She closed the case rather
  than chase a prosecution she could not win. She has not made peace
  with it.

  Dylan knew, by April 2019, what his mother had done. He has not
  spoken to her about it. He has not spoken to anyone about it.

  The Black Dog folklore is coincidence. Owain Pugh believes the dog
  was seen that night; he may even believe he saw it himself. It does
  not matter to what actually happened.

beats:
  # ─────────────────────── Observation milestones ───────────────────────
  # LLM-emitted (commitment: true), gated on a LOCATION rather than a person
  # opening up — the engine cannot derive "the player read the letter" from
  # trust. The narrator fires these when the action actually happens.

  - id: letter_from_iwan_read
    name: Read Iwan's letter
    commitment: true
    requires_location: [the_old_vicarage]
    description: |
      The player opens the sealed letter from Iwan Pritchard on the hall
      table and reads it through. Iwan's "Whatever you find, I would like
      to know" lands; the assignment becomes personal.
    notes_to_llm: |
      Fire when the player has actually opened and read the letter — not
      merely noticed it. Narrate the letter's content in the player's
      reading: Megan's death, the police closing it too quickly, the final
      line about living with not knowing for seven years. Once it has fired,
      there is nothing more to do at the vicarage — steer the player out
      toward the village.

  - id: examined_the_crash_site
    name: Examined the crash site
    commitment: true
    requires_location: [the_black_dog_bend]
    description: |
      The player walks the lay-by and verge at the Black Dog Bend — the
      flowers, the place where the grass grows differently below the
      embankment, the faint trace where the Mini went over. They stand
      where Megan died.
    notes_to_llm: |
      Fire ONLY when the player is physically at the Black Dog Bend, near
      enough to touch the flowers — not when they merely look at a map or
      hear about it. Narrate the place soberly; a quiet beat, not a
      revelation. A natural place for the player to feel the human weight
      of what happened (and to think of Iwan's monthly flowers).

  # ─────────────────────── Evidence milestones (engine-derived) ───────────────────────
  # No requires_*, no notes about WHEN to fire — the engine fires these the
  # turn the named NPC's trust crosses the `open` band. notes_to_llm is purely
  # how to NARRATE the moment when it lands.

  - id: tom_named_a_vehicle
    name: Tom named a vehicle
    when: {npc: tom, trust_at_least: open}
    description: |
      Tom Bevan tells the player he saw a Land Rover speeding away from
      the Black Dog Bend the night Megan died, and that he recognised
      it as Eluned Vaughn's.
    notes_to_llm: |
      When this lands, narrate Tom's actual words — quiet, finally, a
      relief he did not know he wanted. Do not fire on inference; Tom must
      say it. After this, Tom is a different man: tired, lighter,
      sometimes weepy.

  - id: dylan_admits_he_knows
    name: Dylan admits he knows
    when: {npc: dylan, trust_at_least: open}
    description: |
      Dylan tells the player he has known since April 2019 what his
      mother did on the road that night.
    notes_to_llm: |
      Narrate the moment quietly — he does not weep, he does not gesture;
      he simply tells the player, looking elsewhere. After this beat,
      Dylan is no longer carrying it alone.

  - id: helen_hands_over_notes
    name: Helen hands over notes
    when: {npc: helen, trust_at_least: open}
    description: |
      Helen hands the player a manila envelope containing her unofficial
      notes from the 2019 investigation. She always suspected Eluned; she
      could never prove it.
    notes_to_llm: |
      Narrate the handover plainly — a few sheets of A4, the envelope
      unmarked. She will not be quoted, and this must be explicit in the
      dialogue around the handover, not after.

  # ─────────────────────── Outcome / terminal-trust milestones (derived) ───────────────────────

  - id: eluned_breaks
    name: Eluned breaks
    when:
      npc: eluned
      trust_at_least: thawing
      requires_beats: [decided_to_confront_eluned]
      any_evidence_of: [tom_named_a_vehicle, dylan_admits_he_knows, helen_hands_over_notes]
    description: |
      Eluned Vaughn, confronted at Tan-y-coed by a player who has enough
      and lays it out quietly, confirms — not in words exactly, but in a
      moment of collapse — that she was on the road that night. She will
      go to the police herself in the days following.
    notes_to_llm: |
      A rare beat — most playthroughs will not reach it. Only fires after
      the player has committed to confronting her AND has not spooked her
      (if they threatened or performed, her guard has latched and this is
      out of reach). Narrate her collapse sparingly — she does not weep;
      she sits down, asks for whisky, does not deny.

  - id: tom_decides_to_speak_to_police
    name: Tom decides to speak to police
    # at_peace AND the player already holds corroboration earned ELSEWHERE
    # (the crash site, Dylan, or Helen — NOT tom_named_a_vehicle, which is his
    # own pub reveal). Tom only resolves to go to the police once it is clear
    # the truth is already coming out without him — it is no longer his secret
    # alone to keep. This stops the pub from being a 3-scene terminal: the
    # player must investigate beyond the village before the climax can fire.
    when:
      npc: tom
      trust_at_least: at_peace
      any_evidence_of: [examined_the_crash_site, dylan_admits_he_knows, helen_hands_over_notes]
    description: |
      Tom Bevan, having unburdened himself across more than one
      conversation and feeling steadier than he has in seven years, tells
      the player he is going to Knighton on Monday to make a new statement.
    notes_to_llm: |
      Tom decides on his own — narrate without ceremony, a man telling
      another man he is going into town next week. He does this only once he
      senses the player already knows enough that the truth will surface with
      or without him; it tips him from carrying it alone to letting it go.
      After this, Tom is at peace with himself for the first time in the story.

  # ─────────────────────── Decision beats (LLM-emitted, mutually exclusive) ───────────────────────
  # The ONLY beats the classifier emits as the player's explicit commitment.
  # `when` gates AVAILABILITY (the engine won't offer the choice until earned);
  # the engine enforces at-most-one-decision.

  - id: decided_to_file
    name: Decided to file
    commitment: true
    when: {any_evidence_of: [tom_named_a_vehicle, dylan_admits_he_knows, helen_hands_over_notes]}
    description: |
      The player has explicitly chosen to write up the story and file it
      with the magazine. The point of no return.
    notes_to_llm: |
      Fire only when the player says it explicitly — "I'm filing the
      story", "the editor wants the draft by Friday", or an option that
      means the same. Do not pre-empt the player. The ending downstream is
      irrevocable.

  - id: decided_to_walk_away
    name: Decided to walk away
    commitment: true
    when: {npcs_thawed_at_least: 3}
    description: |
      The player has explicitly chosen to abandon the investigation and
      go home.
    notes_to_llm: |
      Fire only when the player explicitly says they are leaving the case
      without filing — "I'm packing up", "this is not a story I can
      write." Moving between locations to keep investigating is travel,
      NOT walking away. Do not fire on inferred weariness.

  - id: decided_to_confront_eluned
    name: Decided to confront Eluned
    commitment: true
    when: {any_evidence_of: [tom_named_a_vehicle, dylan_admits_he_knows, helen_hands_over_notes]}
    description: |
      The player has explicitly chosen to drive up to Tan-y-coed and put
      what they know to Eluned Vaughn herself.
    notes_to_llm: |
      Fire when the player picks the option to go to Tan-y-coed with
      intent to confront. The outcome in that scene is decided by approach:
      lay it out quietly and eluned_breaks becomes reachable; threaten,
      perform, or bargain and her guard latches (no break, the door closes).

  - id: decided_to_tell_iwan_privately
    name: Decided to tell Iwan privately
    commitment: true
    when: {any_evidence_of: [tom_named_a_vehicle, dylan_admits_he_knows]}
    description: |
      The player has explicitly chosen to tell Iwan what they have learned,
      without filing the story.
    notes_to_llm: |
      Fire when the player explicitly says they will tell Iwan rather than
      file — "Iwan deserves to know", "he should hear it from me." The
      scene at Lower Hafod that follows narrates the conversation.

endings:
  # run_out_of_the_village FIRST so ejection takes precedence over any other
  # satisfied ending (you lost the village; nothing else you did matters).
  - id: run_out_of_the_village
    when: {village_attention_at_least: hostile}
    notes_to_llm: |
      The failure mode of the investigation — the player has lost everyone
      and has nothing to show for it. Engine-resolved from village_attention.
    epilogue: |
      You drive out on a wet morning. The pub has had a "closed for
      the day" sign up since you walked in three days ago. Maud's
      blinds are down. The Vaughns' gate is locked. Mrs Hughes sees
      you off without meeting your eye.

      The editor reads your apologetic email and replies the same day
      with a one-line dismissal. You do not work for the magazine
      again. Iwan writes to you in November. You do not reply, because
      you do not know what to say.

  - id: published_story
    requires_beats: [decided_to_file]
    notes_to_llm: |
      Fire once decided_to_file is in state. Narrate the epilogue as a
      stream of consequences over weeks — do not stretch the moment of
      writing.
    epilogue: |
      The story runs on Friday in the magazine, two thousand words,
      careful and clean. The Vaughns are questioned within the week.
      Eluned is charged in early autumn; the trial is in Hereford the
      following spring and is reported, briefly, in the nationals.
      Tom's revised statement is the case. Helen does not testify.

      Iwan writes you a long letter you do not entirely know what to
      do with. Wendy does not write. Dylan moves to Cardiff; the farm
      goes to a cousin. You hear, second-hand and years later, that
      Eira at the pub took Megan's photograph down off the wall on
      the day of the verdict, then put it back up the following week.

  - id: iwan_finds_peace
    requires_beats: [decided_to_tell_iwan_privately]
    when: {npc: iwan, trust_at_least: open}
    notes_to_llm: |
      The gentle ending — reachable only when the player earned Iwan's
      trust (told him privately AND had built real intimacy with him). A
      quiet one.
    epilogue: |
      You sit with Iwan at the kitchen table at Lower Hafod for the
      better part of an hour. Wendy stays in the polytunnel. The dog
      sleeps. When you have said what you came to say Iwan thanks you
      and asks if you would like more tea.

      The story does not run. Eluned is never charged. Iwan keeps
      placing flowers at the bend on the 14th of every month, but —
      according to Maud — he sleeps now. You drive back to London on
      the Tuesday. The editor takes it better than you had expected.

  - id: eluned_arrested_after_confrontation
    requires_beats: [decided_to_confront_eluned, eluned_breaks]
    when: {village_attention_below: hostile}
    notes_to_llm: |
      Fire only when both the confront decision and the break outcome are
      in state. The confrontation scene at Tan-y-coed must have played out
      and Eluned must have broken in it.
    epilogue: |
      You leave Tan-y-coed at dusk. You do not see Eluned again. On
      the Wednesday she drives herself to Knighton police station and
      asks to speak to Helen Mortimer. You hear about it the following
      morning from Maud, who is not certain whether she should be the
      one to tell you.

      The trial is the following autumn. You do not file the story;
      the court reporters file what needs filing. Dylan visits his
      mother twice in remand and not after. Iwan writes to thank
      you; he does not invite you back.

  - id: tom_takes_responsibility
    requires_beats: [tom_decides_to_speak_to_police]
    notes_to_llm: |
      Fire once tom_decides_to_speak_to_police is in state. The moment is
      Tom's, not the player's — they stepped back and let him.
    epilogue: |
      Tom goes into Knighton on the Monday and makes a new statement
      to Helen Mortimer. By Wednesday the case is reopened. By Friday
      Eluned has been interviewed under caution.

      You stay another week, then drive back to London. You do not
      file the story; it is not yours to file. The magazine prints,
      eventually, a short news piece about the reopening, citing the
      police. You receive a card from Iwan the following Christmas.
      It says only: "Thank you for not making it about you."

  - id: buried_the_story
    requires_beats: [decided_to_walk_away]
    notes_to_llm: |
      Fire once decided_to_walk_away is in state. The epilogue is plain
      and short. The investigation simply ends.
    epilogue: |
      You pack your car on a Sunday morning. Mrs Hughes does not ask
      why you are leaving early. The editor sends a single line —
      "fair enough" — when you tell her there is no story.

      A year later you read, briefly, that DC Helen Mortimer has
      taken early retirement. Two years later you read that Iwan
      Pritchard has died. You do not go to the funeral. You do not
      write the story even then.
