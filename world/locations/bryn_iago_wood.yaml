id: bryn_iago_wood
name: Bryn Iago Wood
adjacent_to: [tan_y_coed]

description: |
  The wood that crowns the ridge north of Tan-y-coed — sessile oak
  and hazel, and a few stands of larch that someone tried as a
  plantation fifty years ago and gave up on. The path that climbs
  from the farmyard is steep for the first hundred yards and then
  opens out onto level ground under the trees, with deer scat and old
  badger setts and the kind of silence that walking in a Welsh wood
  at midday has.

  There is a clearing toward the eastern edge where Megan and Dylan
  used to come as children, and again as teenagers, and again in the
  year before she died. There is a stone in the clearing. No marker;
  no inscription. Dylan still walks up here sometimes after dark.

notes:
  - The path is unmaintained; in bad weather it is genuinely difficult.
  - From the eastern edge of the wood, on a clear day, you can see down to the Black Dog Bend a mile distant.
  - The clearing has fresh boot-prints if Dylan has been there recently. Eluned has not been up here in years.
  - The wood is on Vaughn land; in theory walkers have no right to be here, but no one has ever been challenged.
  - This is the most private place Dylan can be reached. A conversation begun here has none of the constraint of the farmyard.
