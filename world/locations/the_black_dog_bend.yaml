id: the_black_dog_bend
name: The Black Dog Bend
adjacent_to: [knighton]

description: |
  A point on the B4368 between Knighton and Pant Goch — a curve where
  the road drops fast off the side of a hill, the camber wrong, the
  hedgerow heavy enough to hide what's coming the other way. The bend
  has had a name since at least the 1840s. The story is of a large
  black dog seen here before deaths. The story is widely shrugged at.
  Local drivers slow without realising they are doing it.

  There is a small lay-by twenty yards before the bend on the village
  side. A bundle of plastic-wrapped flowers, refreshed quarterly by an
  anonymous hand, sits against the embankment. The grass below the
  flowers grows differently to the grass beside.

notes:
  - The flowers are placed by Iwan Pritchard; he goes at dawn on the 14th of each month and does not speak of it.
  - Skid marks from March 2019 are no longer visible to a casual eye. A careful look at the verge still shows where the Mini went over.
  - From this lay-by, walking back toward Knighton takes eight minutes; walking toward the village takes twenty-five through hedgerow you cannot see across.
  - Owain Pugh believes the black dog was seen here in March 2019. He may believe he saw it himself.
  - There is no signage indicating the name; the name is village knowledge only.
