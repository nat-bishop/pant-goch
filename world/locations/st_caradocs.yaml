id: st_caradocs
name: St Caradoc's
short_name: the church
adjacent_to: [the_slaughtered_lamb, the_lane, the_post_office, the_old_vicarage]

description: |
  The parish church — twelfth-century in the nave, Victorian everywhere
  else. The yew in the churchyard is older than the building, older
  than most of the names on the older stones, possibly older than
  Christianity in this valley. The graveyard runs along three sides of
  the church and includes both Pritchards and Vaughns going back
  generations.

  Megan Pritchard's grave is near the east wall, with a small clean
  headstone and fresh flowers more often than not. Father Gareth
  Hughes conducts services here once a month — he is based in
  Knighton — and is otherwise here only for funerals. The church
  is unlocked during daylight; almost no one goes in.

notes:
  - Megan's headstone reads "Megan Mair Pritchard, 17 May 1999 — 14 March 2019, beloved daughter."
  - Inside, the 1923 war memorial lists Pritchard, Vaughn, and Bevan among the dead.
  - The yew is reputed to be over a thousand years old; tourists used to come, before the road got bad.
  - The visitor's book by the door has been signed by the player's editor twice — the editor is from this part of Wales originally, a fact she has not mentioned.
  - Dylan Vaughn comes to the churchyard alone sometimes, in the evening. He does not light a candle.

exit_lines:
  - Step away from the grave and leave St Caradoc's
  - Leave the churchyard, latching the lychgate behind you
