id: the_post_office
name: The Post Office
short_name: the post office
adjacent_to: [the_old_vicarage, the_slaughtered_lamb, st_caradocs]

description: |
  The village shop, post office, and one of two places anyone in Pant
  Goch is reliably likely to pass through in a given day. A bell over
  the door announces arrivals; behind the counter, a stamping block and
  a small Plexiglas cage where Maud Pryce serves the post. The shop
  side sells bread, tins, batteries, dog biscuits, and an out-of-date
  selection of magazines.

  Maud has been postmistress for thirty years. She knows most of what
  gets said in Pant Goch and the deliberate trade is in which parts of
  it she repeats. There is a bench outside in the sun where Owain Pugh
  sometimes sits with his terrier, listening more than he lets on. From
  the bench a path runs up the hill past the pasture to St Caradoc's
  churchyard; the pub is the other way, a short walk down the lane.

notes:
  - Maud reads every postcard before stamping it, and remembers most of them.
  - The shop accepts cash only; the card reader has been "broken" since 2021.
  - The 2019 parish newsletter on the rack still carries Megan Pritchard's funeral notice on the back page.
  - There is a community noticeboard with a faded "missing dog" poster from years ago — the dog was found within the week, but no one took the poster down.
  - The landlord at the pub, Eira Pryce, is Maud's sister-in-law; they do not speak. Asking Maud about Eira will close her down for the remainder of that visit.
