<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug menu — Design 2: Dashboard</title>
<style>
  :root {
    --bg: #0e1117;
    --tile: #161b22;
    --tile-soft: #1c2128;
    --ink: #e6edf3;
    --ink-soft: #9da7b3;
    --ink-faint: #636c76;
    --rule: #2d333b;
    --rule-soft: #21262d;
    --accent: #58a6ff;
    --accent-soft: #1f2c40;
    --good: #3fb950;
    --bad:  #f85149;
    --warn: #d29922;
    --mono:  ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans:  -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--sans); height: 100vh; overflow: hidden; }
  .design-label {
    position: fixed; top: 8px; left: 12px; z-index: 100;
    font: 600 10px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
    background: var(--accent); color: var(--bg); padding: 5px 9px; border-radius: 3px;
  }

  /* Top bar */
  .topbar {
    height: 44px;
    display: flex; align-items: center; gap: 24px;
    padding: 0 20px 0 130px;
    border-bottom: 1px solid var(--rule);
    background: var(--tile);
    font: 12px var(--sans);
  }
  .topbar h1 { margin: 0; font: 600 13px var(--sans); color: var(--ink); }
  .topbar .stat { display: flex; gap: 6px; align-items: baseline; color: var(--ink-soft); font-size: 12px; }
  .topbar .stat strong { font: 600 13px var(--mono); color: var(--ink); }
  .topbar .live {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    margin-left: auto; color: var(--good);
  }
  .topbar .live::before {
    content: ''; width: 6px; height: 6px; background: var(--good); border-radius: 50%;
    box-shadow: 0 0 6px var(--good);
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: var(--rule);
    height: calc(100vh - 44px);
  }
  .tile {
    background: var(--tile);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .tile-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--rule);
    display: flex; align-items: center; gap: 10px;
    background: var(--tile);
  }
  .tile-head h2 {
    margin: 0; font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .tile-head .controls {
    margin-left: auto; display: flex; gap: 8px; align-items: center;
  }
  .tile-body { flex: 1; overflow-y: auto; padding: 12px 16px; }

  /* ===== Pacing ===== */
  .spark-row {
    display: grid;
    grid-template-columns: 150px 1fr 56px 60px;
    align-items: center;
    gap: 12px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule-soft);
    cursor: pointer;
  }
  .spark-row:hover { background: var(--tile-soft); }
  .spark-row.expanded { background: var(--tile-soft); }
  .spark-row .name { font: 500 13px var(--mono); }
  .spark-row .val { font: 600 14px var(--mono); text-align: right; }
  .spark-row .delta { font: 600 11px var(--mono); text-align: right; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--bad); }
  .delta.flat { color: var(--ink-faint); }
  svg.sl { width: 100%; height: 26px; cursor: crosshair; }
  svg.sl polyline { stroke: var(--accent); stroke-width: 1.5; fill: none; }
  svg.sl .area { fill: var(--accent); opacity: 0.12; }
  svg.sl .pt { fill: var(--accent); }
  svg.sl.flat polyline { stroke: var(--ink-faint); }

  .row-detail {
    display: none;
    padding: 12px 16px 12px 32px;
    background: var(--rule-soft);
    border-bottom: 1px solid var(--rule);
    font: 12px var(--mono);
  }
  .row-detail.open { display: block; }
  .cause-row {
    display: grid; grid-template-columns: 36px 50px 1fr 1fr;
    gap: 8px; padding: 3px 0;
  }
  .cause-row .tk { color: var(--ink-faint); }
  .cause-row .src { color: var(--ink-soft); }
  .cause-row .note { color: var(--ink-faint); font-size: 11px; }
  .blocked-section {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule);
  }
  .blocked-section-label {
    font: 600 9.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 4px;
  }
  .blocked-row {
    display: grid; grid-template-columns: 1fr auto;
    padding: 2px 0; font-size: 12px;
  }
  .blocked-row .need { color: var(--warn); }

  /* Sparkline tooltip */
  .sl-tooltip {
    position: fixed;
    background: var(--ink); color: var(--bg);
    padding: 5px 8px; border-radius: 3px;
    font: 11px/1.4 var(--mono);
    pointer-events: none;
    transform: translate(-50%, calc(-100% - 8px));
    white-space: nowrap;
    z-index: 50;
    display: none;
  }

  /* ===== Tick log ===== */
  .tick-row {
    border-bottom: 1px solid var(--rule-soft);
    padding: 8px 0;
  }
  .tick-row summary {
    list-style: none;
    cursor: pointer;
    display: grid;
    grid-template-columns: 32px 1fr auto auto auto;
    gap: 10px;
    align-items: baseline;
    font: 12px var(--sans);
  }
  .tick-row summary::-webkit-details-marker { display: none; }
  .tick-row summary:hover { background: var(--tile-soft); }
  .tick-row .tk { font: 600 11px var(--mono); color: var(--ink-faint); }
  .tick-row .beat { font: 500 12px var(--mono); }
  .tick-row .beat.none { color: var(--ink-faint); font-style: italic; }
  .tick-row .verdict {
    font: 500 10px var(--mono);
    background: var(--accent-soft); color: var(--accent);
    padding: 1px 5px; border-radius: 2px;
  }
  .tick-row .verdict.empty { background: transparent; color: var(--ink-faint); }
  .tick-row .meth { font: 500 10px var(--mono); color: var(--ink-faint); }
  .tick-row .thr { font: 500 10px var(--mono); color: var(--ink-soft); }
  .tick-row .body {
    margin: 8px 0 0; padding: 8px 10px;
    background: var(--rule-soft); border-radius: 3px;
    font: 11.5px/1.5 var(--mono);
  }
  .tick-row .body .label {
    color: var(--ink-faint);
    font: 600 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: 6px;
  }
  .tick-row .body .label:first-child { margin-top: 0; }
  .tick-row .body pre { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; }

  /* ===== Canon ===== */
  table.canon { width: 100%; border-collapse: collapse; font: 12px var(--mono); }
  table.canon th, table.canon td {
    text-align: left; padding: 6px 8px;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: top;
  }
  table.canon th {
    font: 600 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-faint); border-bottom: 1px solid var(--rule);
  }
  table.canon code { font-size: 12px; color: var(--accent); }
  .canon-quote {
    font-style: italic; color: var(--ink-soft);
    background: var(--rule-soft); padding: 1px 5px; border-radius: 2px;
  }
  .salience-bar {
    display: inline-block; width: 32px; height: 4px;
    background: var(--rule); border-radius: 2px; vertical-align: middle;
  }
  .salience-bar > span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .canon-section-head {
    margin: 14px 0 6px;
    font: 600 10px var(--mono); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  .drop-row {
    display: grid; grid-template-columns: 30px 1fr auto;
    gap: 10px; padding: 4px 0;
    font: 11.5px/1.4 var(--mono);
    border-bottom: 1px solid var(--rule-soft);
  }
  .drop-row .reason {
    font: 600 9.5px var(--mono);
    padding: 1px 5px; border-radius: 2px;
  }
  .reason.anchor_fail { background: rgba(248,81,73,0.18); color: var(--bad); }
  .reason.below_salience { background: rgba(210,153,34,0.18); color: var(--warn); }

  /* ===== Beat inspector ===== */
  select.beat-select {
    background: var(--tile-soft); border: 1px solid var(--rule);
    color: var(--ink); font: 12px var(--mono);
    padding: 4px 8px; border-radius: 3px;
    width: 100%;
    margin-bottom: 12px;
  }
  select.beat-select:focus { outline: none; border-color: var(--accent); }
  .beat-meta {
    font: 11.5px var(--mono); color: var(--ink-soft);
    margin-bottom: 12px;
    padding-bottom: 10px; border-bottom: 1px solid var(--rule-soft);
  }
  .beat-meta strong { color: var(--ink); }
  .pred-block { margin: 10px 0; }
  .pred-label {
    font: 600 10px var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 4px;
  }
  .pred-tree {
    background: var(--rule-soft);
    border-radius: 3px;
    padding: 8px 10px;
    font: 11.5px/1.55 var(--mono);
  }
  .atom { display: flex; align-items: baseline; gap: 6px; padding: 1px 0; }
  .atom .check.pass { color: var(--good); }
  .atom .check.fail { color: var(--bad); }
  .atom .text { flex: 1; }
  .atom .note { color: var(--ink-faint); font-size: 10.5px; }
  .atom .short { color: var(--warn); font-size: 10.5px; }
  .indent { padding-left: 16px; border-left: 1px dashed var(--rule); margin-left: 8px; }
  .op-label { color: var(--ink-faint); font-style: italic; }
  .atom code { color: var(--accent); }
</style>
</head>
<body>
<div class="design-label">D2 — Dashboard</div>
<div class="topbar">

/* ============ Sparklines ============ */
function makeSparkSVG(series, range, isFlat, qid) {
  const W = 100, H = 26;
  const [lo, hi] = range;
  const pad = 3;
  const span = hi - lo || 1;
  const points = series.map((v, i) => {
    const x = (i / (series.length - 1)) * W;
    const y = H - pad - ((v - lo) / span) * (H - 2 * pad);
    return [x, y, v, i + 1];
  });
  const polyPts = points.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const areaPts = `0,${H} ${polyPts} ${W},${H}`;
  const ptCircles = points.map(p =>
    `<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="1.5" data-tick="${p[3]}" data-val="${p[2]}" data-q="${qid}"/>`
  ).join('');
  return `<svg class="sl ${isFlat ? 'flat' : ''}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <polygon class="area" points="${areaPts}"/>
    <polyline points="${polyPts}"/>
    ${ptCircles}
  </svg>`;
}

function renderPacing() {
  const el = document.getElementById('pacingBody');
  el.innerHTML = QUALITIES.map(q => {
    const isFlat = q.lastDelta === 0;
    const dCls = q.lastDelta > 0 ? 'up' : q.lastDelta < 0 ? 'down' : 'flat';
    const dArrow = q.lastDelta > 0 ? '↑' : q.lastDelta < 0 ? '↓' : '·';
    const dStr = q.lastDelta === 0 ? '±0' : (q.lastDelta > 0 ? '+' : '') + q.lastDelta;
    const cur = Number.isInteger(q.current) ? q.current : q.current.toFixed(1);

    const causesHtml = q.causes.length === 0
      ? '<div style="color: var(--ink-faint); font-style: italic;">No changes this session.</div>'
      : q.causes.map(c => {
        const cdc = c.delta > 0 ? 'up' : c.delta < 0 ? 'down' : 'flat';
        const cds = (c.delta > 0 ? '+' : '') + c.delta;
        return `<div class="cause-row">
          <span class="tk">T${c.tick}</span>
          <span class="delta ${cdc}">${cds}</span>
          <span class="src">${c.src}</span>
          <span class="note">${c.note}</span>
        </div>`;
      }).join('');

    const blockedHtml = q.blocked.length === 0
      ? '<div style="color: var(--ink-faint); font-style: italic; font-size: 11px;">Nothing currently gated on this quality.</div>'
      : q.blocked.map(b => {
        const shortStr = b.short > 0 ? `${b.short.toFixed(1)} short` : (b.note || '—');
        return `<div class="blocked-row">
          <span><code style="color: var(--accent)">${b.beat}</code> <span style="color: var(--ink-faint)">${b.threshold}</span></span>
          <span class="need">${shortStr}</span>
        </div>`;
      }).join('');

    return `<div class="spark-row" onclick="toggleRow('${q.id}')">
        <span class="name">${q.id}</span>
        ${makeSparkSVG(q.series, q.range, isFlat, q.id)}
        <span class="val">${cur}</span>
        <span class="delta ${dCls}">${dStr} ${dArrow}</span>
      </div>
      <div class="row-detail" id="rd-${q.id}">
        ${causesHtml}
        <div class="blocked-section">
          <div class="blocked-section-label">Blocked on this quality</div>
          ${blockedHtml}
        </div>
      </div>`;
  }).join('');

  // Hover tooltips on sparkline points
  const tooltip = document.getElementById('slTooltip');
  document.querySelectorAll('svg.sl .pt').forEach(pt => {
    pt.addEventListener('mouseenter', e => {
      const t = pt.dataset.tick;
      const v = pt.dataset.val;
      const qid = pt.dataset.q;
      const c = QUALITIES.find(x => x.id === qid).causes.find(c => c.tick == t);
      const cause = c ? `${c.src}` : '(no change)';
      tooltip.textContent = `T${t} · ${qid} = ${v} · ${cause}`;
      tooltip.style.display = 'block';
    });
    pt.addEventListener('mousemove', e => {
      tooltip.style.left = e.clientX + 'px';
      tooltip.style.top = e.clientY + 'px';
    });
    pt.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  });
}

function toggleRow(qid) {
  const rd = document.getElementById('rd-' + qid);
  const wasOpen = rd.classList.contains('open');
  document.querySelectorAll('.row-detail').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.spark-row').forEach(el => el.classList.remove('expanded'));
  if (!wasOpen) {
    rd.classList.add('open');
    rd.previousElementSibling.classList.add('expanded');
  }
}

/* ============ Tick log ============ */
function renderTicks() {
  const el = document.getElementById('tickBody');
  el.innerHTML = TICKS.map(t => {
    const beatLabel = t.fired
      ? `<span class="beat">${t.fired}${t.fireNum ? ' · ' + t.fireNum : ''}</span>`
      : t.retired
        ? `<span class="beat none">retired ${t.retired}</span>`
        : `<span class="beat none">no fire</span>`;
    const verdict = t.classify ? `<span class="verdict">${t.classify}</span>` : `<span class="verdict empty">—</span>`;
    return `<details class="tick-row">
      <summary>
        <span class="tk">T${t.tick}</span>
        ${beatLabel}
        ${verdict}
        <span class="thr">${t.fired ? t.thread : (t.trigger === 'boot' ? 'boot' : t.trigger)}</span>
        <span class="meth">${t.method}</span>
      </summary>
      <div class="body">
        <div class="label">trigger</div>
        <pre>${t.trigger === 'boot' ? 'boot tick' : 'player on `' + t.trigger + '`'}</pre>
        ${t.fired ? `
        <div class="label">fired</div>
        <pre>${t.fired}  (kind: ${t.kind}, thread: ${t.thread}${t.fireNum ? ', fire ' + t.fireNum : ''})</pre>` : ''}
        ${t.retired ? `
        <div class="label">retired</div>
        <pre>${t.retired}  — ${t.retire_reason}</pre>` : ''}
        ${t.classify ? `
        <div class="label">classifier</div>
        <pre>verdict: "${t.classify}"</pre>` : ''}
        <div class="label">selection</div>
        <pre>method: ${t.method}${t.eligible ? '\neligible: [' + t.eligible.join(', ') + ']' : ''}${t.rationale ? '\nrationale: ' + t.rationale : ''}</pre>
        ${t.deltas.length ? `
        <div class="label">effects applied</div>
        <pre>${t.deltas.map(d => `${d.q}  ${d.d}`).join('\n')}</pre>` : ''}
      </div>
    </details>`;
  }).join('');
}

/* ============ Canon ============ */
function renderCanon() {
  const el = document.getElementById('canonBody');
  el.innerHTML = `
    <table class="canon">
      <thead><tr><th>key</th><th>value</th><th>quote</th><th>sal</th><th>T</th></tr></thead>
      <tbody>${CANON.map(c => {
        const sw = (c.salience * 100).toFixed(0);
        return `<tr>
          <td><code>${c.key}</code></td>
          <td>${c.value}</td>
          <td><span class="canon-quote">"${c.quote}"</span></td>
          <td><span class="salience-bar"><span style="width:${sw}%"></span></span> ${c.salience.toFixed(2)}</td>
          <td>T${c.origin_tick} <span style="color: var(--ink-faint)">(${c.decay_age}t)</span></td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div class="canon-section-head">Dropped candidates · last 20 turns</div>
    ${CANON_DROPS.map(d => `<div class="drop-row">
      <span style="color: var(--ink-faint)">T${d.tick}</span>
      <span><code style="color: var(--accent)">${d.key}</code> = "${d.value}"
        <div style="color: var(--ink-faint); font-size: 10.5px; margin-top: 1px;">${d.note}</div>
      </span>
      <span class="reason ${d.reason}">${d.reason}</span>
    </div>`).join('')}
  `;
}

/* ============ Beats ============ */
function renderPredTree(node) {
  if (!node) return '';
  if (node.type === 'And_' || node.type === 'Or_') {
    const op = node.type.replace('_', '');
    return `<div class="atom"><span class="op-label">${op}:</span></div>
      <div class="indent">${node.children.map(c => renderPredTree(c)).join('')}</div>`;
  }
  if (node.type === 'Not_') {
    return `<div class="atom"><span class="op-label">Not:</span></div>
      <div class="indent">${renderPredTree(node.child)}</div>`;
  }
  const check = node.verdict ? '<span class="check pass">✓</span>' : '<span class="check fail">✗</span>';
  let label = '';
  if (node.type === 'QualityAtLeast') {
    label = `<span class="text">QualityAtLeast(<code>${node.q}</code>, ${node.threshold})</span>
             <span class="note">cur=${node.current}</span>`;
    if (node.shortBy) label += ` <span class="short">(${node.shortBy} short)</span>`;
  } else if (node.type === 'BeatFired') {
    label = `<span class="text">BeatFired(<code>${node.beat}</code>)</span>`;
    if (node.note) label += ` <span class="note">${node.note}</span>`;
  } else if (node.type === 'ClassifierVerdict') {
    label = `<span class="text">ClassifierVerdict(${node.axis}, "${node.value}")</span>`;
    if (node.note) label += ` <span class="note">${node.note}</span>`;
  } else if (node.type === 'ref') {
    label = `<span class="text">${node.name}</span>`;
  }
  return `<div class="atom">${check}${label}</div>`;
}

function renderBeatDetail(beatId) {
  const b = BEATS.find(x => x.id === beatId);
  const tree = PRED_TREES[beatId];
  const detail = document.getElementById('beatDetail');
  if (!b) { detail.innerHTML = ''; return; }
  let fireStatus = '';
  if (b.fired && b.kind === 'scene') {
    fireStatus = `<strong style="color: var(--good)">fired</strong> · ${b.fires} fires${b.retired ? ' · retired' : ''}${b.in_flight ? ' · in flight' : ''}`;
  } else if (b.fired) {
    fireStatus = '<strong style="color: var(--good)">fired</strong>';
  } else if (b.status === 'terminal') {
    fireStatus = '<strong style="color: var(--ink-faint)">terminal · not fired</strong>';
  } else {
    fireStatus = '<strong style="color: var(--warn)">blocked</strong>';
  }

  detail.innerHTML = `
    <div class="beat-meta">
      kind: <strong>${b.kind}</strong> · npc: <strong>${b.npc}</strong> · thread: <strong>${b.thread}</strong> · ends_session: <strong>${b.ends_session}</strong><br/>
      ${fireStatus}
    </div>
    ${tree && tree.entry_when ? `
      <div class="pred-block">
        <div class="pred-label">entry_when</div>
        <div class="pred-tree">${renderPredTree(tree.entry_when)}</div>
      </div>` : ''}
    ${tree && tree.exit_when ? `
      <div class="pred-block">
        <div class="pred-label">exit_when</div>
        <div class="pred-tree">${renderPredTree(tree.exit_when)}</div>
      </div>` : ''}
    ${!tree ? '<div style="color: var(--ink-faint); font-style: italic;">(no predicate detail in this mockup)</div>' : ''}
  `;
}

function renderBeatSelect() {
  const sel = document.getElementById('beatSelect');
  sel.innerHTML = BEATS.map(b => {
    const status = b.fired ? '✓' : (b.status === 'terminal' ? '○' : '✗');
    return `<option value="${b.id}">${status}  ${b.id}</option>`;
  }).join('');
  sel.value = 'aria.recognition_scene';
  sel.addEventListener('change', e => renderBeatDetail(e.target.value));
}

/* ============ init ============ */
renderPacing();
renderTicks();
renderCanon();
renderBeatSelect();
renderBeatDetail('aria.recognition_scene');
</script>
