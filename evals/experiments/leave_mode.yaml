# A/B experiment: should the player keep the ability to leave a scene whenever
# they want (control), or only when the narrator soft-closes it (test)?
#
# The knob is RunConfig.allow_mid_scene_leave (src/handler/scene_loop.py),
# threaded per arm. The control affordance was added to cut filler (a scene once
# ran 43 straight filler turns without it), so the headline metric to watch is
# filler_turn_ratio / post_exhaustion_turn_ratio.
#
# Schema: `shared` is identical for both arms (fairness — arms cannot override
# it); `arms` is exactly two (the first is the control / diff baseline); each
# arm's `run_config` is splatted into handler.scene_loop.RunConfig(**run_config),
# so a future knob is a new file here, not new code.
name: leave_mode
description: Leave-whenever (control) vs gated-to-soft-close (test).

shared:
  personas: null            # null = all of personas.yaml
  runs_per_persona: 4
  max_scenes: 60
  seed: 0                   # seeds pairwise blinding / order

judge:
  model: null               # null → Settings.judge_model (qwen via inferno)

arms:
  - name: control
    run_config: { allow_mid_scene_leave: true }
  - name: test
    run_config: { allow_mid_scene_leave: false }
