id: lower_hafod
name: Lower Hafod
adjacent_to: [tan_y_coed]

description: |
  The Pritchard smallholding — twenty-two acres of marginal ground
  half a mile up a track from Tan-y-coed, the buildings hunched
  against the prevailing weather. An old stone cottage, a tin-roofed
  shed, a greenhouse that lost three panes in last winter's wind and
  has not been mended. Iwan keeps a dozen ewes and some hens; Wendy
  grows vegetables in a polytunnel and sells eggs by the door for
  honesty money.

  Megan grew up here. Her bedroom is still her bedroom. Owain Pugh,
  an old friend of Iwan's, has lived in the second bedroom since his
  own cottage burned in 2021 and the insurance refused to pay out.
  The kitchen is the centre of the house; everyone gathers here,
  including the dog.

notes:
  - Iwan wrote to the player's editor in late January 2026, six weeks before the player arrived.
  - Wendy wants the investigation dropped; she has said so directly to Iwan and once to Maud at the post office.
  - Megan's bedroom is preserved largely as she left it in 2019. Iwan has the key on a string round his neck.
  - There is an honesty box outside selling free-range eggs at £2.50 a dozen. Wendy refills it most mornings.
  - Owain has been off the drink since 2022 and is a more reliable presence in the house than Wendy gives him credit for.
