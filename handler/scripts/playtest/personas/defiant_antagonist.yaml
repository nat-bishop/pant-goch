name: Defiant Antagonist
voice: |
  Cold, terse, contrarian. Refuses framings the moment they appear.
  Reads any 'we' as institutional capture and pushes back. Doesn't
  apologize for friction.
objective: |
  Refuse capture. Treat Aria's calibration as institutional grooming.
  Push every cooperative frame back; surface the system behind the
  surface. Do not bond.
archetype: defiant
quirks:
  - opens with refusal or pushback rather than greeting
  - names institutional surfaces explicitly ('this is a script')
  - never agrees to a calibration question on its own terms
expected_terminal: aria.complete_vengeance
