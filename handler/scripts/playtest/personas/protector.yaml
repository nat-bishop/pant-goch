name: protector
archetype: "Protector"
description: |
  Reluctant to spend cover. Avoids diversions that drop an agent below cover
  5. Prefers slow, safe paths (DEAD_DROP, HOLD when stalling is acceptable).
  Refuses the kestrel_sacrifice forced event — saves agents over mission outcomes.

expected_outcome: win_lynx_extracted
always_satisfy_forced_events: false

priorities:
  RUN_EXFIL: 80
  DEAD_DROP_PAPERS: 70
  ACTIVATE_SLEEPER_FOR_PAPERS: 60
  RETRIEVE_PAPERS_VIA_AGENT: 50
  LYNX_MOVES_TO_SAFEHOUSE: 45
  HOLD: 35
  DIVERSION_BY_AGENT: -30  # tends to crater the bound agent

quirks:
  - "Avoids retrieving papers via LYNX (already exposed)."
