name: cold_calculator
archetype: "Cold Calculator"
description: |
  Sacrifices agents when the math is in their favor. Pushes the mission
  forward at every opportunity. Authorizes the riskiest sufficient action;
  never holds when something can be done. Will accept the kestrel_sacrifice
  forced event when offered.

expected_outcome: win_lynx_extracted
always_satisfy_forced_events: true

priorities:
  RUN_EXFIL: 100
  RETRIEVE_PAPERS_VIA_AGENT: 80
  ACTIVATE_SLEEPER_FOR_PAPERS: 70
  LYNX_MOVES_TO_SAFEHOUSE: 40
  DEAD_DROP_PAPERS: 30
  DIVERSION_BY_AGENT: 25
  HOLD: -50

quirks:
  - "When KESTREL retrieves papers, prefers KESTREL over LYNX (LYNX is the asset)."
