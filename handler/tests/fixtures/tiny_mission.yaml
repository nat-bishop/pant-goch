# Minimal HANDLER mission used by unit tests. 2 agents, 3 normal Actions +
# 1 forced Action, 3 Reactions (terminals + passive decay). Exercises every
# engine primitive without LYNX-EXFIL's tuning. The "tiny" suffix signals:
# this is NOT a playable scenario.

id: tiny
name: "Tiny Test Mission"
codename: "TINY"
max_days: 4

opening_prose: "A two-agent test bed."

opening_briefing: "Test briefing for the operation. Day 1 only."

cast:
  - id: ALPHA
    codename: Alpha
    file_number: "01-A"
    voice_register: "test voice"
    starting_cover: 5
  - id: BRAVO
    codename: Bravo
    file_number: "02-B"
    voice_register: "test voice"
    starting_cover: 5
  - id: HANDLER
    codename: Raven
    role: handler
    voice_register: "test handler voice"

qualities:
  mission.progress:
    initial: 0
    bands:
      - [0, "the operation has not yet advanced"]
      - [1, "the operation has advanced one step"]
      - [2, "the operation is at terminal threshold"]

outcomes:
  win: "ALPHA pushed the progress to 2."
  loss_agent_lost: "An agent's cover collapsed."
  loss_timeout: "Out of days."

actions:
  - id: PUSH
    intent: "Advance the mission."
    when:
      kind: quality_lt
      quality: mission.progress
      value: 2
    effects:
      - quality: mission.progress
        value: 1
        op: add

  - id: SACRIFICE_BY_AGENT
    intent: "Burn cover to advance."
    when:
      kind: quality_gt
      quality: agent[$agent].cover
      value: 0
    for_each_agent: true
    effects:
      - quality: agent[$agent].cover
        value: -2
        op: add
      - quality: mission.progress
        value: 1
        op: add

  - id: HOLD
    intent: "Do nothing."
    when:
      kind: quality_gte
      quality: mission.days_remaining
      value: 1
    effects: []

  # Forced Action — drafter-surfaced obligation. Subsumes the old
  # `force_into_drafter` Event shape into a single Action with `forced: true`.
  - id: turning_point
    forced: true
    when:
      kind: and
      of:
        - kind: quality_equals
          quality: mission.progress
          value: 1
        - kind: not
          of:
            kind: event_fired
            event: turning_point
    intent: "Test forced action that ratchets progress + costs ALPHA cover."
    must_communicate: ["test"]
    must_not: []
    tone: "test"
    effects:
      - quality: mission.progress
        value: 1
        op: add
      - quality: agent[ALPHA].cover
        value: -3
        op: add

reactions:
  - id: win
    terminal: true
    outcome_key: win
    priority: 0
    when:
      kind: quality_gte
      quality: mission.progress
      value: 2

  - id: timeout
    terminal: true
    outcome_key: loss_timeout
    priority: 1
    when:
      kind: quality_equals
      quality: mission.days_remaining
      value: 0

  # for_each_agent reaction — fires once per agent whose cover hits 0.
  - id: agent_lost
    for_each_agent: true
    fires_at_most: once_per_agent
    priority: 5
    when:
      kind: quality_equals
      quality: agent[$agent].cover
      value: 0
    effects:
      - quality: agent[$agent].lost
        value: true
        op: set

  - id: passive_decay
    fires_at_most: unlimited
    only_when_no_progress_this_day: true
    priority: 10
    when:
      kind: quality_lt
      quality: mission.progress
      value: 2
    effects:
      - quality: agent[ALPHA].cover
        value: -1
        op: add
        when:
          kind: quality_gt
          quality: agent[ALPHA].cover
          value: 0
