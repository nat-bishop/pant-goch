player_starts_at: the_old_vicarage

opening_seed: |
  The player has just arrived in Pant Goch after a three-hour drive
  from London. Mrs Hughes the housekeeper (background; not a major
  character) lets them into the Old Vicarage and hands over the keys.
  She mentions there is a letter waiting on the hall table from
  someone called Iwan Pritchard, then goes back to the kitchen to lay
  a fire. The light is failing; rain on the slate roof.

  The brief from the magazine's editor, which the player has read in
  the car and would summarise to themselves like this:

    Six weeks ago, Iwan Pritchard wrote claiming his daughter's death
    in 2019 was not the drink-driving accident the police recorded.
    He thinks another vehicle was involved and the local force did
    not want to look. The editor has given the player a six-week
    budget and this room at the Old Vicarage. Story or no, the money
    runs out mid-September.

  Iwan's letter, when opened, is two careful pages of older hand —
  factual, restrained, with an address and a phone number at the
  bottom and a line under the signature that reads: "Whatever you
  find, I would like to know. I have lived with not knowing for seven
  years."
